<!DOCTYPE html>
<!-- PROVA — passo a passo. 1080x1920, ou ?ar=1440x1028 (painel 40%).
     Diferente da lista: aqui existe PROGRESSO. O passo da vez é bloco azul;
     quando o próximo entra, o anterior assenta, desbota e o número vira ✓
     verde. O trilho à esquerda enche até o passo atual.
       ?hd=Do zero ao <b>primeiro agente</b>&it=Cria a conta|5 minutos@0.5;Escreve o processo|uma vez@1.6;Agenda|e esquece@2.7&dur=5 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
#stage{padding:0 64px;justify-content:center}
.hd{font-size:86px;margin-bottom:54px}
.ps{position:relative;display:flex;flex-direction:column;gap:30px}
.tr{position:absolute;left:48px;width:12px;margin-left:-6px;background:var(--ink2);border-radius:6px}
.tr i{position:absolute;left:0;right:0;top:0;height:0;background:var(--ink);border-radius:6px}
.pa{position:relative;z-index:1;display:flex;align-items:center;gap:28px}
.nu{flex:none;width:96px;height:96px;overflow:hidden;background:#fff;border:var(--bw) solid var(--ink);border-radius:var(--raio-s);opacity:0}
.nu .ro{display:flex;flex-direction:column}
.nu .ro span{height:88px;display:flex;align-items:center;justify-content:center;font:700 42px/1 var(--fm)}
.cd{flex:1;min-width:0;padding:22px 28px;opacity:0;color:var(--ink)}
.cd b{display:block;font:700 56px/1.05 var(--fd);letter-spacing:var(--ls);white-space:nowrap;color:inherit}
.cd em{display:block;font:600 38px/1.15 var(--fd);font-style:normal;margin-top:4px;white-space:nowrap;color:inherit;opacity:.78}
html.p,html.p body,html.p #stage{width:1440px;height:1028px}
html.p #stage{padding:44px var(--marg)}
html.p .hd{font-size:72px;margin-bottom:30px}
html.p .ps{gap:18px}
html.p .cd{padding:16px 24px}
html.p .cd b{font-size:48px}
html.p .cd em{font-size:32px}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="hd" id="h"></div>
  <div class="ps" id="ps"><div class="tr" id="tr"><i id="tf"></i></div></div>
</div>
<script>
if (D.q('ar', '').startsWith('1440x1028')) document.documentElement.classList.add('p');
const dur = D.n('dur', '5');
// `tam`: tamanho do título de cada passo (px). Pra imagem de story, o número é o que tem que ser lido
// `linha=1`: descrição à esquerda e valor à direita, na mesma linha (tabela de números)
if (D.q('linha') === '1') document.head.insertAdjacentHTML('beforeend', `<style>.cd{display:flex;align-items:center;justify-content:space-between;gap:28px}.cd em,html.p .cd em{order:1;margin:0;white-space:normal;font-size:40px;opacity:1}.cd b{order:2}</style>`);
if (D.q('tam')) document.head.insertAdjacentHTML('beforeend', `<style>.cd b,html.p .cd b{font-size:${D.n('tam','56')}px}.ps{gap:44px}html.p .ps{gap:22px}</style>`);
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('h').innerHTML = D.q('hd', 'Do zero ao <b>primeiro agente</b>');
const its = D.itens('it', 'Cria a conta|5 minutos@0.5;Escreve o processo|uma vez só@1.6;Agenda a rotina|e ela roda sozinha@2.7', ['nome', 'det']);
const ps = document.getElementById('ps');
its.forEach((x, i) => ps.insertAdjacentHTML('beforeend',
  `<div class="pa" id="p${i}"><span class="nu" id="u${i}"><span class="ro" id="r${i}"><span>${i + 1}</span><span>✓</span></span></span><div class="cd nb" id="c${i}"><b>${x.nome}</b>${x.det ? `<em>${x.det}</em>` : ''}</div></div>`));

D.monta(tl => {
  D.cabe('.hd', 50);
  D.cabe('.cd b', 32, '.cd');
  D.cabe('.cd em', 24, '.cd');
  const ac = D.css('--ac'), sur = D.css('--sur'), ink = D.css('--ink'), ok = D.css('--ok');
  const ctr = i => { const p = document.getElementById('p' + i); return p.offsetTop + p.offsetHeight / 2; };
  const tr = document.getElementById('tr');
  tr.style.top = ctr(0) + 'px'; tr.style.height = (ctr(its.length - 1) - ctr(0)) + 'px';
  D.camera(dur, 1.0, 1.025);
  if (D.q('kick')) D.carimbo('#k', .08);
  D.titulo('#h', .15);
  tl.fromTo(tr, {opacity: 0}, {opacity: 1, duration: .3}, D.at(its[0].t));
  its.forEach((x, i) => {
    const t = D.at(x.t);
    tl.fromTo('#u' + i, {opacity: 0, scale: .3, rotation: -30}, {opacity: 1, scale: 1, rotation: 0, duration: .4, ease: 'back.out(2.6)'}, t);
    D.pousa('#c' + i, x.t + .06, {dx: -36, dr: 0, som: 'pop'});
    tl.to('#c' + i, {backgroundColor: ac, color: '#fff', duration: .25}, t + .1);
    if (i > 0) {
      tl.to('#c' + (i - 1), {backgroundColor: sur, color: D.css('--ink6'), '--shx': '4px', duration: .3}, t);
      tl.to('#r' + (i - 1), {yPercent: -50, duration: .4, ease: D.P.MOLA}, t);
      tl.to('#u' + (i - 1), {backgroundColor: ok, color: '#fff', duration: .25}, t);
      tl.to('#tf', {height: ctr(i) - ctr(0), duration: .5, ease: D.P.MOLA}, t);
      D.cue(x.t, 'click');
    }
  });
  D.sai(['#k', '#h', '#ps'], dur - .45);
  return dur;
});
</script>
</body>
</html>
