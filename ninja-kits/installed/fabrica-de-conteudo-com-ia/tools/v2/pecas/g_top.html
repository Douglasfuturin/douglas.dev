<!DOCTYPE html>
<!-- GANCHO — top N / ranking que se monta. 1080x1920, tela cheia.
     As posições já têm lugar (o 1 em cima), e cada uma cai no instante em que é
     dita — normalmente de trás pra frente. O foco amarelo desliza até a que
     acabou de entrar, e o nº 1 chega em bloco azul, com a mola do herói.
       ?hd=Os 5 agentes que eu <b>mais uso</b>&it=5|Relatórios|toda segunda@0.6;…;1|Anúncios|analisa e sobe@3.6&dur=5.5 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
#stage{padding:0 64px;justify-content:center}
.hd{font-size:86px;margin-bottom:48px}
.rk{position:relative;display:flex;flex-direction:column;gap:22px}
.it{position:relative;z-index:1;display:flex;align-items:center;gap:26px;padding:20px 28px 20px 20px;opacity:0}
.it .ps{flex:none;width:104px;height:104px;display:flex;align-items:center;justify-content:center;background:var(--mk);
  border:var(--bw) solid var(--ink);border-radius:var(--raio-s);font:700 50px/1 var(--fm);color:var(--ink)}
.it .tx{flex:1;min-width:0}
.it b{display:block;font:700 58px/1.04 var(--fd);letter-spacing:var(--ls);white-space:nowrap}
.it em{display:block;font:600 38px/1.15 var(--fd);color:var(--ink6);font-style:normal;margin-top:4px;white-space:nowrap}
.it.um em{color:var(--act)}
.it.um .ps{background:#fff}
.foco{position:absolute;z-index:0;left:0;top:0;opacity:0;background:var(--mk);border:var(--bw) solid var(--ink);border-radius:var(--raio)}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="hd" id="h"></div>
  <div class="rk" id="rk"><div class="foco" id="fo"></div></div>
</div>
<script>
const dur = D.n('dur', '5.5');
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('h').innerHTML = D.q('hd', 'Os 5 agentes que eu <b>mais uso</b>');
const its = D.itens('it', '5|Relatórios|toda segunda@0.6;4|Membros|cuida da área@1.2;3|Carrosséis|prepara e entrega@1.8;2|Suporte|responde o e-mail@2.4;1|Anúncios|analisa, propõe e sobe@3.3', ['pos', 'nome', 'det']);
const rk = document.getElementById('rk');
[...its].sort((a, b) => parseInt(a.pos) - parseInt(b.pos)).forEach(x => {
  const d = document.createElement('div');
  const um = parseInt(x.pos) === 1;
  d.className = 'it nb' + (um ? ' cor-ac um' : ''); d.id = 'p' + x.pos;
  d.innerHTML = `<span class="ps">${x.pos}</span><span class="tx"><b>${x.nome}</b>${x.det ? `<em>${x.det}</em>` : ''}</span>`;
  rk.appendChild(d);
});

D.monta(tl => {
  D.cabe('.hd', 52);
  D.cabe('.it b', 34, '.tx');
  D.cabe('.it em', 26, '.tx');
  D.camera(dur, 1.0, 1.03);
  if (D.q('kick')) D.carimbo('#k', .1);
  D.titulo('#h', .15);
  const ordem = [...its].sort((a, b) => a.t - b.t);
  ordem.forEach((x, i) => {
    const um = parseInt(x.pos) === 1;
    D.pousa('#p' + x.pos, x.t, um ? {s: 1.12, ease: D.P.HEROI, rot: D.P.ROT} : {dx: -40, rot: D.inclina(i) * .5, som: 'pop'});
    if (um) D.cue(x.t, 'impact');
  });
  D.desliza('#fo', ordem.map(x => '#p' + x.pos), ordem.map(x => x.t));
  D.sai(['#k', '#h', '.it', '#fo'], dur - .45);
  return dur;
});
</script>
</body>
</html>
