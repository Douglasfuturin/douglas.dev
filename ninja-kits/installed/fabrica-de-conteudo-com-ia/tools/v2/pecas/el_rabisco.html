<!DOCTYPE html>
<!-- ELEMENTO — rabisco à mão por cima do vídeo. 1080x1920 ou 1920x1080 (?ar=), --alpha.
     tipo=circulo (contorna a área) · sublinhado (embaixo) · seta (chega apontando
     pra ela) · x (risca) · confete (estoura do centro). Área: r=x,y,w,h em px do
     quadro. O traço treme como mão (semente fixa: sai igual toda vez), em amarelo
     com a borda tinta por baixo; o confete é de papel com borda e cai com arrasto.
       ?tipo=circulo&r=240,700,600,300&cor=mk&rot=isso aqui&t0=0.2&dur=3 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html,body{background:transparent}
#stage{position:relative;overflow:hidden;background:none;padding:0;display:block}
#sv{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sb{fill:none;stroke:var(--ink);stroke-width:28;stroke-linecap:round;stroke-linejoin:round}
.tr{fill:none;stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.tg{position:absolute;padding:14px 20px 12px;font:700 34px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:var(--mk);border-radius:var(--raio-s);opacity:0}
.cf{position:absolute;left:0;top:0;border:3px solid var(--ink);box-sizing:border-box;opacity:0}
.on{position:absolute;border-radius:50%;border:12px solid var(--mk);box-shadow:0 0 0 5px var(--ink),inset 0 0 0 5px var(--ink);opacity:0}
</style>
</head>
<body>
<div id="stage"><svg id="sv"></svg><div class="tg nb cor-ink" id="tg"></div></div>
<script>
const R = document.documentElement, HZ = D.q('ar', '1080x1920').startsWith('1920');
if (HZ) R.classList.add('h');
const W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920, $ = id => document.getElementById(id);
const tipo = ['circulo', 'sublinhado', 'seta', 'x', 'confete'].includes(D.q('tipo')) ? D.q('tipo') : 'circulo';
const [rx, ry, rw, rh] = D.q('r', HZ ? '760,380,400,220' : '240,700,600,300').split(',').map(Number);
const cor = {mk: 'var(--mk)', ac: 'var(--ac)', no: 'var(--no)', br: '#fff'}[D.q('cor', 'mk')] || 'var(--mk)';
const t0 = D.n('t0', '0.2'), dur = Math.max(t0 + 1.9, D.n('dur', '3'));
let sem = Math.round(D.n('semente', '7')) * 9973 + 1;
const rnd = () => (sem = sem * 16807 % 2147483647) / 2147483647;
const cx = rx + rw / 2, cy = ry + rh / 2;
const treme = (x, y, a = 5) => [x + (rnd() - .5) * a, y + (rnd() - .5) * a];
// polilinha → curva suave (Catmull-Rom em Bézier)
const suave = P => P.map((c, i) => { if (!i) return `M${c[0].toFixed(1)} ${c[1].toFixed(1)}`; const a = P[i - 2] || P[i - 1], b = P[i - 1], d = P[i + 1] || c;
  return `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (d[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (d[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`; }).join(' ');
const tracos = []; let tagEm = [cx, ry - 70];
if (tipo === 'circulo') {
  const ax = rw / 2 + 36, ay = rh / 2 + 32, P = [];
  for (let g = -105; g <= 300; g += 9) { const k = 1 + (rnd() - .5) * .07 + (g > 230 ? (g - 230) / 700 : 0), a = g * Math.PI / 180; P.push([cx + Math.cos(a) * ax * k, cy + Math.sin(a) * ay * k]); }
  tracos.push({d: suave(P), t: .7}); tagEm = [cx + ax * .55, cy - ay - 64];
} else if (tipo === 'sublinhado') {
  const y = ry + rh + 24, P = [], Q = [];
  for (let i = 0; i <= 14; i++) { const f = i / 14; P.push(treme(rx - 16 + f * (rw + 32), y + Math.sin(f * 3) * 5 - f * 8, 4)); }
  for (let i = 0; i <= 8; i++) { const f = i / 8; Q.push(treme(rx + rw * .92 - f * rw * .55, y + 24 + f * 5, 4)); }
  tracos.push({d: suave(P), t: .45}, {d: suave(Q), t: .28}); tagEm = [rx + rw * .7, y + 90];
} else if (tipo === 'seta') {
  const daEsq = rx > 320, s = daEsq ? [Math.max(70, rx - 250), Math.min(H - 140, ry + rh + 300)] : [Math.min(W - 70, rx + rw + 250), Math.min(H - 140, ry + rh + 300)];
  const e = [daEsq ? rx - 22 : rx + rw + 22, ry + rh * .72], c = [s[0], e[1] + 30], P = [];
  for (let i = 0; i <= 16; i++) { const f = i / 16, u = 1 - f; P.push(treme(u * u * s[0] + 2 * u * f * c[0] + f * f * e[0], u * u * s[1] + 2 * u * f * c[1] + f * f * e[1], i < 16 ? 4 : 0)); }
  const q = P[P.length - 3], ang = Math.atan2(e[1] - q[1], e[0] - q[0]), L = 66;
  const p1 = [e[0] - L * Math.cos(ang - .55), e[1] - L * Math.sin(ang - .55)], p2 = [e[0] - L * Math.cos(ang + .55), e[1] - L * Math.sin(ang + .55)];
  tracos.push({d: suave(P), t: .5}, {d: `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${e[0]} ${e[1]} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`, t: .18});
  tagEm = [s[0], s[1] + 70];
} else if (tipo === 'x') {
  tracos.push({d: suave([...Array(9)].map((_, i) => treme(rx + i / 8 * rw, ry + i / 8 * rh, 7))), t: .28},
    {d: suave([...Array(9)].map((_, i) => treme(rx + rw - i / 8 * rw, ry + i / 8 * rh, 7))), t: .28});
}
const sv = $('sv'), NS = 'http://www.w3.org/2000/svg';
sv.setAttribute('viewBox', `0 0 ${W} ${H}`);
const pares = tracos.map(tr => ['sb', 'tr'].map(c => { const p = document.createElementNS(NS, 'path'); p.setAttribute('class', c); p.setAttribute('d', tr.d); if (c === 'tr') p.style.stroke = cor; sv.appendChild(p); return p; }));
const rot = D.q('rot', tipo === 'confete' ? '' : 'isso aqui'); $('tg').textContent = rot;
const cfs = [];
if (tipo === 'confete') {
  const CORES = ['var(--mk)', 'var(--ac)', '#fff', 'var(--no)', 'var(--mk)'];
  for (let i = 0; i < 46; i++) {
    const e = document.createElement('div'); e.className = 'cf';
    const w = 16 + rnd() * 22, h = rnd() < .35 ? w : 10 + rnd() * 10;
    Object.assign(e.style, {width: w + 'px', height: h + 'px', background: CORES[i % CORES.length], marginLeft: -w / 2 + 'px', marginTop: -h / 2 + 'px'});
    $('stage').appendChild(e);
    const a = -Math.PI / 2 + (rnd() - .5) * 2.4, v = 900 + rnd() * 1300;
    cfs.push({e, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r0: rnd() * 360, vr: (rnd() - .5) * 900, fl: 6 + rnd() * 10});
  }
  const on = document.createElement('div'); on.className = 'on'; on.id = 'on';
  Object.assign(on.style, {left: cx - 170 + 'px', top: cy - 170 + 'px', width: '340px', height: '340px'}); $('stage').appendChild(on);
}
D.monta(tl => {
  let t = D.at(t0);
  pares.forEach((par, k) => {
    const L = par[0].getTotalLength() || 1;
    par.forEach(p => { p.style.strokeDasharray = L + 2; p.style.strokeDashoffset = L + 2; });
    tl.to(par, {strokeDashoffset: 0, duration: tracos[k].t, ease: k ? 'power2.out' : 'power2.inOut'}, t);
    t += tracos[k].t + .04;
  });
  if (pares.length) D.cue(t0, 'marca');
  if (cfs.length) {
    const K = 2.4, G = 2600, T = 1.6, o = {p: 0};
    const voa = () => { const tau = o.p * T, e = Math.exp(-K * tau), f = (1 - e) / K, fade = o.p < .72 ? 1 : 1 - (o.p - .72) / .28;
      cfs.forEach(c => gsap.set(c.e, {x: cx + c.vx * f, y: cy + c.vy * f + (G / K) * (tau - f), rotation: c.r0 + c.vr * tau, scaleY: Math.cos(tau * c.fl), opacity: o.p > 0 ? fade : 0})); };
    voa();
    tl.to(o, {p: 1, duration: T, ease: 'none', onUpdate: voa}, t);
    tl.fromTo('#on', {opacity: 1, scale: .3}, {opacity: 0, scale: 1.7, duration: .5, ease: 'power2.out'}, t);
    D.cue(t0, 'pop'); D.cue(t0 + .05, 'shimmer');
    t += .5;
  }
  if (rot) {
    const tg = $('tg'), w = tg.offsetWidth, h = tg.offsetHeight;
    tg.style.left = Math.max(40, Math.min(W - 40 - w, tagEm[0] - w / 2)) + 'px'; tg.style.top = Math.max(60, Math.min(H - 60 - h, tagEm[1] - h / 2)) + 'px';
    D.carimbo('#tg', t + .05, D.P.ROT - 2);
  }
  D.sai(['#sv', '#tg'], dur - .45);
  return dur;
});
</script>
</body>
</html>
