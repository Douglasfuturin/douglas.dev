<!DOCTYPE html>
<!-- GANCHO — a jogada contada: a mesa em miniatura, as cartas entram, saem, shiftam e questam
     enquanto ele narra. 1080x1920 ou ?ar=1920x1080, --alpha (`fundo` escurece o vídeo atrás, 0 a 1; `t0` é
     quando a mesa entra, pra deixar a foto de verdade aparecer antes).
     Três fileiras: a dele em cima (`ele`), a mão (`mao`) e o lore no meio, a sua embaixo (`eu`).
     Carta = imagem `<pasta>/<id>.png` (a segunda cópia da mesma carta é `id~2`, mesma imagem);
     o id que estiver em `rot` (id:Nome,…) vira um cartão só
     com o nome, pra carta cuja versão não se sabe. Toda carta que um dia entra numa fileira já
     tem o lugar dela desde o começo: nada escorrega, a carta cai no seu lugar.
     `passos` = t|ação|lado|alvo|extra, separados por ; (nota, lore e fim: t|ação|alvo)
       entra  — a carta cai na fileira; `extra` = id de uma carta que já saiu: ela cai no lugar
                dela (a fileira não ganha mais um lugar e as cartas ficam maiores)
       sai    — `extra` deck (gira e some num deck) ou banida (treme, fica vermelha e cai)
       shift  — a carta da mão voa pra cima de `extra` (ids separados por +) e fica no lugar
                do primeiro; os de baixo somem sob ela
       quest  — `alvo` = id:lore+id:lore; as cartas deitam e o lore de cada uma sobe (o lado
                diz de quem: t|quest|ele|pocahontas:6)
       vira   — a carta deita, sem lore (exausta: questou antes, ou foi usada)
       lore   — o placar de lore vai até `alvo`
       nota   — o letreiro de cima troca pra `alvo`
       fim    — o carimbo `alvo` bate no meio da mesa
       ?pasta=../midia&eu=perfil-avatar,b&ele=c&mao=b~2&lore=13&rot=b:Mickey,c:Rival,e:Vilão,b~2:Mickey e Minnie&passos=0.6|nota|Ele joga o vilão;1.0|entra|ele|e;1.6|sai|eu|perfil-avatar|deck;2.6|shift|mao|b~2|b;3.6|quest|eu|b~2:8;3.9|lore|21;4.6|fim|VENCI&dur=6 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
#veu{position:absolute;inset:0;background:var(--pp);opacity:0}
.rot{position:absolute;left:60px;font:700 30px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;
  padding:10px 16px;opacity:0}
.fila{position:absolute;left:40px;right:40px;display:flex;justify-content:center;gap:var(--gap,18px)}
.slot{position:relative;width:var(--w);height:calc(var(--w) * 1.395);flex:none}
.ct{position:absolute;inset:0;border-radius:calc(var(--w) * .05);opacity:0;
  box-shadow:var(--shx,6px) var(--shx,6px) 0 var(--ink9);transform-origin:50% 50%}
.ct img{width:100%;height:100%;display:block;border-radius:inherit}
.ct.nome{display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  font:700 calc(var(--w) * .15)/1.05 var(--fd);color:var(--ink);background:var(--sur);
  border:var(--bw) solid var(--mk)}
.ct.vermelha{outline:10px solid var(--no)}
.mais{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:700 64px/1 var(--fd);
  padding:8px 18px;opacity:0;white-space:nowrap}
#nota{position:absolute;left:60px;right:60px;top:80px;display:flex;justify-content:center}
#nota span{font:700 44px/1.15 var(--fd);padding:16px 26px;text-align:center;opacity:0}
#meio{position:absolute;left:var(--mx,60px);right:var(--mx,60px);display:flex;align-items:center;justify-content:space-between}
#lore{display:flex;align-items:baseline;gap:18px;padding:16px 28px;opacity:0}
#lore small{font:700 30px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase}
#lore b{font:700 120px/1 var(--fd);letter-spacing:-.03em;min-width:1.3em;text-align:right}
#deck{position:absolute;width:120px;height:168px;border-radius:12px;opacity:0;
  display:flex;align-items:center;justify-content:center;font:700 26px/1 var(--fm);text-transform:uppercase}
#fim{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html.h #nota{top:28px}
html.h{--mx:300px}
html.h .rot{left:300px}
#fim span{font:700 150px/1 var(--fd);padding:18px 46px;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="veu"></div>
  <div id="nota"><span class="nb cor-ink" id="nt"></span></div>
  <div class="rot nb cor-ink" id="r-ele"></div><div class="fila" id="f-ele"></div>
  <div id="meio"><div class="fila" id="f-mao" style="position:relative;left:0;right:0;justify-content:flex-start"></div>
    <div id="lore" class="nb cor-mk"><small>lore</small><b id="lv"></b></div></div>
  <div class="rot nb cor-ink" id="r-eu"></div><div class="fila" id="f-eu"></div>
  <div id="deck" class="nb cor-ink">deck</div>
  <div id="fim"><span class="nb cor-ok" id="fs"></span></div>
</div>
<script>
const dur = D.n('dur', '6');
const pasta = D.q('pasta', '../midia').replace(/\/$/, '');
const rot = Object.fromEntries(D.q('rot', '').split(',').filter(Boolean).map(s => s.split(':')));
const lista = k => D.q(k, '').split(',').map(s => s.trim()).filter(Boolean);
const passos = D.q('passos', '').split(';').filter(Boolean).map(s => {
  const [t, acao, ...r] = s.split('|');
  // nota, lore e fim não têm lado: t|nota|texto
  const [lado, alvo, extra] = ['nota', 'lore', 'fim'].includes(acao) ? ['', r[0]] : r;
  return {t: parseFloat(t), acao, lado, alvo, extra: extra || ''};
});
// cada fileira já nasce com o lugar de toda carta que vai passar por ela
const filas = {ele: lista('ele'), eu: lista('eu'), mao: lista('mao')};
const inicio = {ele: new Set(filas.ele), eu: new Set(filas.eu), mao: new Set(filas.mao)};
const herda = {};   // carta que entra no lugar de outra que saiu: id → id do lugar
passos.filter(p => p.acao === 'entra' && !filas[p.lado].includes(p.alvo)).forEach(p => {
  if (p.extra && filas[p.lado].includes(p.extra)) herda[p.alvo] = p.extra;
  else filas[p.lado].push(p.alvo);
});

// layout: nota em cima, a fileira dele, o meio (mão + lore), a sua; a legenda mora embaixo de 1250
const H = (D.q('ar', '')).startsWith('1920x1080');
if (H) document.documentElement.classList.add('h');
const Y = H ? {ele: 170, meio: 470, eu: 730} : {ele: 230, meio: 620, eu: 880};
const MAXW = H ? 220 : 236, LARG = H ? 1700 : 1000;
document.getElementById('r-ele').textContent = D.q('nome_ele', 'Ele');
document.getElementById('r-eu').textContent = D.q('nome_eu', 'Você');
document.getElementById('r-ele').style.top = (Y.ele - 62) + 'px';
document.getElementById('r-eu').style.top = (Y.eu - 62) + 'px';
document.getElementById('meio').style.top = Y.meio + 'px';
const larg = {ele: 0, eu: 0, mao: 0};
const c = (lado, id) => document.getElementById(dom(lado, id));
const dom = (lado, id) => `c-${lado}-${id.replace(/[^a-z0-9-]/gi, '_')}`;
const pousou = {};   // a carta que shiftou: o lugar onde ela ficou (pro +lore do quest)
const carta = (id, lado) => {
  const s = Object.assign(document.createElement('div'), {className: 'slot'});
  const c = Object.assign(document.createElement('div'), {className: 'ct' + (rot[id] ? ' nome' : '')});
  c.id = dom(lado, id);
  if (rot[id]) c.textContent = rot[id];
  else c.appendChild(Object.assign(new Image(), {src: `${pasta}/${id.split('~')[0]}.png`, alt: id}));
  s.appendChild(c);
  return s;
};
['ele', 'eu', 'mao'].forEach(lado => {
  const f = document.getElementById('f-' + lado), n = filas[lado].length || 1;
  const w = lado === 'mao' ? 150 : Math.min(MAXW, Math.floor((LARG - 18 * (n - 1)) / n));
  larg[lado] = w;
  f.style.setProperty('--w', w + 'px');
  if (lado !== 'mao') f.style.top = Y[lado] + 'px';
  filas[lado].forEach(id => f.appendChild(carta(id, lado)));
  // a que herda o lugar mora no mesmo slot, por baixo até a sua hora
  Object.entries(herda).forEach(([id, de]) => { const v = c(lado, de); if (v && filas[lado].includes(de))
    v.parentNode.appendChild(carta(id, lado).firstChild); });
});
document.getElementById('fim').style.top = (Y.meio + 230) + 'px';
const lore0 = D.n('lore', '0');
document.getElementById('lv').textContent = lore0;
if (!D.q('lore', '')) document.getElementById('lore').remove();   // sem `lore`, a mesa não mostra placar

D.monta(tl => {
  const caixa = el => el.getBoundingClientRect();
  const t0 = D.n('t0', '0');
  tl.to('#veu', {opacity: D.n('fundo', '0.7'), duration: .3, ease: 'power1.out'}, D.at(t0));
  D.pousa('#r-ele', t0 + .1, {dr: 0}); D.pousa('#r-eu', t0 + .15, {dr: 0}); D.pousa('#lore', t0 + .2, {dr: 0});
  ['ele', 'eu', 'mao'].forEach(lado => [...inicio[lado]].forEach((id, i) =>
    D.pousa('#' + c(lado, id).id, t0 + .2 + i * .07, {rot: D.inclina(i) * .4})));
  let lore = lore0;
  passos.forEach(p => {
    const el = p.lado ? c(p.lado, p.alvo) : null;
    if (p.acao === 'nota') {
      tl.to('#nt', {opacity: 0, duration: .1}, Math.max(0, D.at(p.t) - .1));
      tl.call(() => { document.getElementById('nt').textContent = p.alvo; }, null, D.at(p.t));
      tl.call(() => { document.getElementById('nt').textContent = ''; }, null, 0);
      D.pousa('#nt', p.t, {dr: 0, dy: -24});
    } else if (p.acao === 'entra') {
      D.pousa('#' + el.id, p.t, {som: 'pop', dr: 6});
    } else if (p.acao === 'sai' && p.extra === 'deck') {
      // embaralhado no deck: a carta gira, encolhe e entra no deck, que aparece ao lado da mão
      const a = caixa(el), dk = document.getElementById('deck');
      const dx = (H ? 300 : 60) + larg.mao + 40, dy = Y.meio + (larg.mao * 1.395 - 168) / 2;
      gsap.set(dk, {left: dx, top: dy});
      tl.fromTo(dk, {opacity: 0, scale: .6}, {opacity: 1, scale: 1, duration: .25, ease: 'back.out(2)'}, D.at(p.t));
      tl.to(el, {x: dx + 60 - (a.left + a.width / 2), y: dy + 84 - (a.top + a.height / 2), rotation: 540,
        scale: .25, duration: .7, ease: 'power2.in'}, D.at(p.t) + .1);
      tl.to(el, {opacity: 0, duration: .12}, D.at(p.t) + .72);
      tl.to(dk, {rotation: 8, duration: .08, yoyo: true, repeat: 3}, D.at(p.t) + .8);
      tl.to(dk, {opacity: 0, duration: .25}, D.at(p.t) + 1.5);
      D.cue(p.t + .1, 'swish');
    } else if (p.acao === 'sai') {
      tl.to(el, {x: 10, duration: .05, yoyo: true, repeat: 5}, D.at(p.t));
      tl.call(() => el.classList.add('vermelha'), null, D.at(p.t));
      tl.call(() => el.classList.remove('vermelha'), null, 0);
      tl.to(el, {y: 300, rotation: 25, opacity: 0, duration: .5, ease: 'power2.in'}, D.at(p.t) + .3);
      D.cue(p.t, 'impact');
    } else if (p.acao === 'shift') {
      // a carta da mão voa pra cima da primeira base; as outras bases deslizam pra baixo dela e somem
      const bases = p.extra.split('+').map(id => c('eu', id)), a = caixa(el), b = caixa(bases[0]);
      const s = larg.eu / larg.mao;
      tl.to(el, {x: b.left + b.width / 2 - (a.left + a.width / 2), y: b.top + b.height / 2 - (a.top + a.height / 2),
        scale: s, rotation: -6, duration: .55, ease: 'power3.inOut'}, D.at(p.t));
      tl.to(el, {rotation: 0, duration: .25, ease: 'back.out(3)'}, D.at(p.t) + .55);
      bases.slice(1).forEach(o => {
        const k = caixa(o);
        tl.to(o, {x: b.left - k.left, y: b.top - k.top, duration: .4, ease: 'power2.inOut'}, D.at(p.t) + .1);
      });
      tl.to(bases, {opacity: 0, duration: .15}, D.at(p.t) + .5);
      pousou[p.alvo] = bases[0].parentNode;
      D.cue(p.t + .55, 'impact');
    } else if (p.acao === 'vira') {
      tl.to(el, {rotation: 90, duration: .3, ease: 'power2.inOut'}, D.at(p.t));
    } else if (p.acao === 'quest') {
      p.alvo.split('+').forEach((par, i) => {
        const [id, v] = par.split(':'), e = c(p.lado || 'eu', id) || c('eu', id) || c('mao', id);
        tl.to(e, {rotation: 90, duration: .3, ease: 'power2.inOut'}, D.at(p.t) + i * .18);
        if (!v) return;
        const m = Object.assign(document.createElement('div'), {className: 'mais nb cor-mk', textContent: '+' + v});
        (pousou[id] || e.parentNode).appendChild(m);
        tl.fromTo(m, {opacity: 0, y: 30, scale: .5}, {opacity: 1, y: 0, scale: 1, duration: .35, ease: 'back.out(2.4)'},
          D.at(p.t) + i * .18 + .2);
        D.cue(p.t + i * .18 + .2, 'pop');
      });
    } else if (p.acao === 'lore') {
      const de = lore; lore = parseFloat(p.alvo);
      D.conta('#lv', de, lore, p.t, .7, n => Math.round(n));
    } else if (p.acao === 'fim') {
      document.getElementById('fs').textContent = p.alvo;
      D.carimbo('#fs', p.t, -4);
    }
  });
  D.sai('#stage > *:not(#veu)', dur - .4);
  tl.to('#veu', {opacity: 0, duration: .3}, dur - .3);
  return dur;
});
</script>
</body>
</html>
