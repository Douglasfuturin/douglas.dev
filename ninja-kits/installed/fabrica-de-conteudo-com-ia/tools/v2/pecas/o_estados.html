<!DOCTYPE html>
<!-- OFERTA — estados sucessivos. 1080x1920, --alpha.
     UMA peça que muda de estado — nunca uma lista que fica sobre o rosto.
     O rótulo rola pro próximo, o selo troca, a cor muda e a largura se ajusta
     com mola. Os quadradinhos embaixo dizem em que passo está.
       ?e=Processo salvo|✓@0.3;Rotina agendada|↻@2.6;No seu celular|→@4.9&pos=topo&dur=7.5 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.zona{position:absolute;left:56px;right:70px;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.zona.topo{top:260px}
.zona.centro{top:840px}
.zona.base{top:1320px}
.ch{display:flex;align-items:center;gap:24px;padding:20px 34px 20px 20px;opacity:0;overflow:hidden}
.ic{width:96px;height:96px;overflow:hidden;align-items:flex-start;justify-content:center}
.ic .ro{display:flex;flex-direction:column}
.ic .ro span{height:88px;display:flex;align-items:center;justify-content:center;font:700 50px/1 var(--fd)}
.jan{height:1.15em;overflow:hidden;font:700 68px/1.15 var(--fd);letter-spacing:var(--ls)}
.jan .ro{display:flex;flex-direction:column;align-items:flex-start}
.jan .ro span{white-space:nowrap;display:block;height:1.15em}
.pas{display:flex;gap:12px;padding-left:6px}
.pas i{width:30px;height:30px;border:var(--bw) solid var(--ink);border-radius:6px;background:var(--sur);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="zona" id="z">
    <div class="ch nb" id="ch"><span class="ic" id="ic"><span class="ro" id="ri"></span></span><span class="jan" id="jn"><span class="ro" id="rl"></span></span></div>
    <div class="pas" id="ps"></div>
  </div>
</div>
<script>
const dur = D.n('dur', '7.5');
document.getElementById('z').classList.add(['topo', 'centro', 'base'].includes(D.q('pos')) ? D.q('pos') : 'topo');
const es = D.itens('e', 'Processo salvo|✓@0.3;Rotina agendada|↻@2.6;No seu celular|→@4.9', ['rot', 'ic']);
const ri = document.getElementById('ri'), rl = document.getElementById('rl'), ps = document.getElementById('ps');
es.forEach((e, i) => {
  ri.insertAdjacentHTML('beforeend', `<span>${e.ic || String(i + 1).padStart(2, '0')}</span>`);
  rl.insertAdjacentHTML('beforeend', `<span>${e.rot}</span>`);
  ps.insertAdjacentHTML('beforeend', `<i id="p${i}"></i>`);
});

D.monta(tl => {
  const mk = D.css('--mk'), ac = D.css('--ac'), sur = D.css('--sur'), ink = D.css('--ink');
  // três tons que se alternam: papel → marcador → bloco azul
  const TONS = [{bg: sur, cor: ink, ic: mk}, {bg: mk, cor: ink, ic: sur}, {bg: ac, cor: '#fff', ic: mk}];
  const jn = document.getElementById('jn');
  const zona = document.getElementById('z').clientWidth;
  const lim = zona - 20 - 96 - 24 - 34 - D.SH - 8;
  const larg = [...rl.children].map(s => s.scrollWidth);
  // se um rótulo não cabe, a fonte da janela encolhe pra todos
  const pior = Math.max(...larg);
  if (pior > lim) { const px = Math.floor(68 * lim / pior); jn.style.fontSize = px + 'px'; }
  const ws = [...rl.children].map(s => s.scrollWidth + 4);
  gsap.set(jn, {width: ws[0]});
  const tom = i => TONS[i % TONS.length];
  gsap.set('#ch', {backgroundColor: tom(0).bg, color: tom(0).cor});
  gsap.set('#ic', {backgroundColor: tom(0).ic});

  D.pousa('#ch', es[0].t, {rot: D.P.ROT, s: 1.08, som: 'pop'});
  es.forEach((_, i) => tl.fromTo('#p' + i, {opacity: 0, scale: .4}, {opacity: 1, scale: 1, duration: .3, ease: 'back.out(2.4)'}, D.at(es[0].t) + .2 + i * .06));
  tl.to('#p0', {backgroundColor: ink, duration: .2}, D.at(es[0].t) + .3);
  es.forEach((e, i) => {
    if (!i) return;
    const t = D.at(e.t);
    const f = -100 * i / es.length;
    tl.to('#rl', {yPercent: f, duration: .45, ease: D.P.MOLA}, t);
    tl.to('#ri', {yPercent: f, duration: .45, ease: D.P.MOLA}, t + .04);
    tl.to(jn, {width: ws[i], duration: .5, ease: D.P.MOLA}, t);
    tl.to('#ch', {backgroundColor: tom(i).bg, color: tom(i).cor, duration: .25}, t);
    tl.to('#ic', {backgroundColor: tom(i).ic, duration: .25}, t);
    tl.to('#ch', {scale: 1.06, duration: .12, ease: 'power2.out', yoyo: true, repeat: 1, transformOrigin: 'left center'}, t);
    tl.to('#p' + i, {backgroundColor: ink, duration: .2}, t + .1);
    D.cue(e.t, 'swish');
  });
  D.flutua('#ch', es[0].t + .7, dur - .5, 1.2);
  D.sai(['#ch', '#ps'], dur - .45);
  return dur;
});
</script>
</body>
</html>
