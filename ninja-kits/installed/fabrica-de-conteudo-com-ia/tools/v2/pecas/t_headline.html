<!DOCTYPE html>
<!-- TIPO — headline sobre vídeo, v2. Mesmo objeto do chip (borda + sombra dura).
     No topo a frase ESTÁ INTEIRA NO PRIMEIRO QUADRO (regra de conteúdo, mantida):
     o movimento vem depois — o marcador varre o <i> e o card flutua.
     No centro (CTA do fecho) ela cai, e as palavras sobem.
       ?l=Zero gestor de tráfego. <i>Só um agente</i>.&dur=3.24
       ?l=Clique em <i>Saiba Mais</i>&dur=5.13&pos=centro&tam=68 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
/* a mesma fonte da legenda (captions_viral): a Creato, se estiver instalada, senão a
   Montserrat livre que viaja com os helpers — nunca um caminho de uma máquina só */
@font-face{font-family:'CapviralCreato';font-weight:400 900;
  src:local('Creato Display Black'),local('CreatoDisplay-Black'),
      url('../../video-use/assets/fontes/Montserrat%5Bwght%5D.ttf') format('truetype')}
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.zona{position:absolute;left:64px;right:76px;display:flex;align-items:center}
.zona.topo{top:130px;min-height:260px}
.zona.centro{top:0;bottom:0}
.card{width:100%;padding:30px 40px;opacity:0}
.fr{font:900 var(--tam,64px)/1.12 'CapviralCreato',var(--fd);letter-spacing:.005em;
  text-align:center;text-transform:uppercase;color:var(--ink)}
.fr i{font-style:normal;color:var(--ac);padding:0 .08em;
  background:linear-gradient(var(--mk),var(--mk)) no-repeat 0 60%/0% 88%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
</style>
</head>
<body>
<div id="stage"><div class="zona" id="z"><div class="card nb" id="c"><div class="fr" id="f"></div></div></div></div>
<script>
const dur = D.n('dur', '4');
const centro = D.q('pos') === 'centro';
document.getElementById('z').classList.add(centro ? 'centro' : 'topo');
document.documentElement.style.setProperty('--tam', D.q('tam', '64') + 'px');
document.getElementById('f').innerHTML = D.q('l', 'Headline');

D.monta(tl => {
  D.cabe('.fr', 44, '.card');
  if (centro) {
    D.pousa('#c', .36, {rot: D.P.ROT * .6});
    const ws = D.palavras('#f', .44);
    D.marca('.fr i', .44 + ws.length * .055 + .1);
  } else {
    D.pousa('#c', .1, {rot: D.P.ROT * .6, dy: -24});
    D.marca('.fr i', .32);
  }
  D.flutua('#c', centro ? 1.1 : .2, dur - .45, .9);
  D.sai('#c', dur - .4);
  return dur;
});
</script>
</body>
</html>
