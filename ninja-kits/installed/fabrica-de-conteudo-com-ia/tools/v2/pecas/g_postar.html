<!DOCTYPE html>
<!-- GANCHO — o reel de hoje, que ainda não existe. 1080x1920, opaca.
     Um celular com a tela de reel novo vazia e a semana inteira pra postar. As tarefas do caminho
     batem em volta dele e cada uma leva um risco na hora em que a fala diz "sem". Em `t_cheio` o reel
     aparece na tela (`img`), e a câmera entra nele até a tela do celular virar a tela inteira: o
     vídeo segue dali. Moldura genérica — não imita aparelho nem app de ninguém.
       img      o quadro em que o vídeo continua · vazio  o rótulo da tela vazia ("o reel de hoje")
       dias     "S|T|Q|Q|S|S|D" · rot  o rótulo deles (todo dia) · t_dias  quando acendem
       x        "TAREFA@t;…" — bate em t-0,15 e é riscada em t · t_cheio · t_zoom · dur
       cel      "escala,x,y" do celular antes do zoom (padrão 1,0,0) · pos  "x,y,giro;…" das tarefas.
                No anúncio, 0.72,151,189 e as tarefas dentro da zona segura deixam toda letra nela
     ?x=GRAVAR@1.0;EDITAR@1.5;ROTEIRIZAR@2.0&t_dias=0.3&t_cheio=2.5&t_zoom=2.7&dur=3.3 -->
<html lang="pt-BR" data-qa="entra-seco fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px}
#stage{width:1080px;height:1920px;padding:0;display:block;position:relative;overflow:hidden}
#cel{position:absolute;inset:0;transform-origin:0 0}
.corpo{position:absolute;left:218px;top:268px;width:644px;height:1189px;border-radius:72px;background:var(--ink);
  box-shadow:var(--sh) var(--sh) 0 var(--ink6)}
.tela{position:absolute;left:240px;top:290px;width:600px;height:1067px;border-radius:52px;overflow:hidden;background:var(--sur)}
.tela .mid,.tela .vazio{position:absolute;inset:0;width:100%;height:100%}
.tela .vazio span{font-size:34px}
.tela img.mid{object-fit:cover;opacity:0}
.ui{position:absolute;inset:0}
.barra{position:absolute;left:34px;right:34px;top:44px;display:flex;align-items:center;justify-content:space-between}
.barra .tt{font:700 34px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.dias{position:absolute;left:34px;right:34px;top:116px;display:flex;flex-direction:column;gap:14px;padding:18px 20px}
.dias .rt{font:700 26px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink6)}
.dias .fx{display:flex;justify-content:space-between}
.dia{position:relative;width:58px;height:58px;border:var(--bw) solid var(--ink);border-radius:var(--raio-s);background:var(--sur);
  display:flex;align-items:center;justify-content:center;font:700 28px/1 var(--fm);color:var(--ink);overflow:hidden}
.dia i{position:absolute;inset:0;background:var(--mk);transform:scaleY(0);transform-origin:bottom}
.dia b{position:relative}
.pub{position:absolute;left:34px;right:34px;bottom:44px;height:96px;font-size:44px}
.tf{position:absolute;padding:20px 30px;font:800 64px/1 var(--fd);letter-spacing:var(--ls);opacity:0;white-space:nowrap}
.tf s{position:absolute;left:-14px;right:-14px;top:50%;height:14px;margin-top:-7px;background:var(--no);border:3px solid var(--ink);
  border-radius:4px}
</style>
</head>
<body>
<div id="stage">
  <div id="cel">
    <div class="corpo"></div>
    <div class="tela" id="tela">
      <div class="ui" id="ui">
        <div class="barra"><span class="tt" id="tt"></span><span class="tt">✕</span></div>
        <div class="dias nb" id="ds"><span class="rt" id="rd"></span><div class="fx" id="fx"></div></div>
        <div class="pub btn" id="pb">Publicar</div>
      </div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const dur = D.n('dur', '3.3'), tCheio = D.n('t_cheio', '2.5'), tZoom = D.n('t_zoom', '2.7'), tDias = D.n('t_dias', '0.3');
const X = D.q('x', 'GRAVAR@1.0;EDITAR@1.5;ROTEIRIZAR@2.0').split(';').filter(Boolean)
  .map(s => { const [tx, t] = s.split('@'); return {tx, t: parseFloat(t)}; });
const DIAS = D.q('dias', 'S|T|Q|Q|S|S|D').split('|');
$('tt').textContent = D.q('titulo', 'reel novo');
$('rd').textContent = D.q('rot', 'todo dia');
$('fx').innerHTML = DIAS.map(d => `<span class="dia"><i></i><b>${esc(d)}</b></span>`).join('');
// a tela vazia ("do zero") e, por baixo, o quadro em que o vídeo continua
const tela = $('tela');
const vz = document.createElement('div'); vz.className = 'vazio'; vz.innerHTML = `<span>${esc(D.q('vazio', 'o reel de hoje'))}</span>`;
tela.insertBefore(vz, $('ui'));
const im = D.q('img', '') ? D.midia(tela, D.q('img', ''), 'o vídeo') : null;
if (im) tela.insertBefore(im, $('ui'));
// as tarefas em volta do celular, alternando os lados
const POS = D.q('pos', '40,520,-4;600,860,3;60,1200,-2;620,420,4').split(';').map(s => s.split(',').map(Number));
const [cs, cx, cy] = D.q('cel', '1,0,0').split(',').map(Number);
gsap.set('#cel', {scale: cs, x: cx, y: cy});
X.forEach((x, i) => $('stage').insertAdjacentHTML('beforeend',
  `<div class="tf nb cor-mk" id="x${i}" style="left:${POS[i % POS.length][0]}px;top:${POS[i % POS.length][1]}px">${esc(x.tx)}<s id="r${i}"></s></div>`));

D.monta(tl => {
  // a semana acende, um dia por vez: é isso que se quer
  DIAS.forEach((_, i) => tl.to(`#fx .dia:nth-child(${i + 1}) i`, {scaleY: 1, duration: .14, ease: D.P.EASE}, D.at(tDias) + i * .07));
  D.cue(tDias, 'tick-roll', {dur: +(DIAS.length * .07).toFixed(3)});
  // cada tarefa bate e leva o risco no "sem"
  X.forEach((x, i) => {
    gsap.set('#r' + i, {scaleX: 0, rotation: -6, transformOrigin: 'left center'});
    D.pousa('#x' + i, Math.max(.05, x.t - .15), {rot: POS[i % POS.length][2], s: 1.3, dy: -20, som: 'pop'});
    tl.to('#r' + i, {scaleX: 1, duration: .16, ease: 'power3.out'}, D.at(x.t) + .1);
    D.cue(x.t, 'erro');
  });
  // o reel aparece na tela e a câmera entra nele: a tela do celular vira a tela inteira
  const ims = tela.querySelector('img.mid');
  if (ims) tl.to(ims, {opacity: 1, duration: .18, ease: 'none'}, D.at(tCheio));
  tl.to('#ui', {opacity: 0, duration: .15, ease: 'none'}, D.at(tCheio));
  tl.to('.tf', {opacity: 0, scale: .9, duration: .15, ease: D.P.SAI}, tZoom);
  D.cue(tCheio, 'certo');
  const k = 1080 / 600;
  tl.to('#cel', {scale: k, x: -240 * k, y: -290 * k, duration: Math.max(.2, dur - tZoom - .05), ease: 'power3.inOut'}, tZoom);
  tl.to('#tela', {borderRadius: 0, duration: Math.max(.2, dur - tZoom - .05), ease: 'power3.inOut'}, tZoom);
  D.cue(tZoom, 'zoom-in');
  return dur;
});
</script>
</body>
</html>
