<!DOCTYPE html>
<!-- ENSAIO — contagem / lista numerada de pontos. 1920x1080, --alpha (frente).
     Cada ponto pousa quando é dito, com o número em bloco; a sombra amarela
     anda até o ponto atual e os anteriores apagam um pouco.
       ?kick=3 motivos&it=A ferramenta mudou@0.5;O custo caiu@1.5;Quem explica bem ganha@2.5&lado=dir&t0=0.2&dur=4.5 -->
<html lang="pt-BR" class="h alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/ensaio.js"></script>
<style>
.cl{position:absolute;top:160px}
.cl .kick{font-size:22px}
.ls{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.fx{position:absolute;left:0;top:0;background:var(--mk);border:var(--bw) solid var(--ink);border-radius:var(--raio);opacity:0}
.it{position:relative;display:flex;align-items:center;gap:24px;padding:18px 32px 18px 18px;max-width:100%;opacity:0}
.it .ic{width:84px;height:84px;font-size:38px}
.it b{font:700 44px/1.15 var(--fd);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
</style>
</head>
<body>
<div id="stage"><div class="cl" id="cl" data-c="frente"><div class="kick" id="k"></div><div class="ls" id="ls"><div class="fx" id="fx"></div></div></div></div>
<script>
const dur = D.n('dur', '4.5'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
const p = E.pessoa('dir');
Object.assign($('cl').style, p.lado === 'esq' ? {left: (p.r + 60) + 'px', width: (1800 - p.r - 60) + 'px'} : {left: '140px', width: (p.l - 220) + 'px'});
$('k').textContent = D.q('kick', '3 motivos');
const its = D.itens('it', 'A ferramenta mudou@0.5;O custo caiu@1.5;Quem explica bem ganha@2.5', ['tx']);
its.forEach((o, i) => $('ls').insertAdjacentHTML('beforeend', `<div class="it nb"><div class="ic">${i + 1}</div><b>${o.tx}</b></div>`));
D.monta(tl => {
  const els = [...document.querySelectorAll('.it')], ts = its.map((o, i) => isNaN(o.t) ? t0 + .4 + i : o.t);
  D.carimbo('#k', t0, 0);
  els.forEach((el, i) => { D.pousa(el, ts[i], {dx: -30, dy: 0}); if (i > 0) tl.to(els[i - 1], {opacity: .55, duration: .3}, D.at(ts[i]) + .1); });
  D.desliza('#fx', els, ts.map(t => t + .1), {off: 12});
  D.sai(['#k', '.it', '#fx'], dur - .45);
  return dur;
});
</script>
</body>
</html>
