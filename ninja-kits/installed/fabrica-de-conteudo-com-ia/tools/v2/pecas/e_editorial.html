<!DOCTYPE html>
<!-- EFEITO — tela dividida editorial: painel de gráfico em cima, o rosto num cartão de cantos redondos embaixo, e a letra em quatro vozes (fala, rótulo, bloco sobreposto, chamada) mais o título espaçado. A gramática medida no Nick Saraev, com a voz editorial do núcleo (nucleo/editorial.css). 1080x1920, --alpha, em camadas: tras = painel + gráfico; frente = letra.
     Tudo num parâmetro só, `r` (JSON):
       cenas    [[de, ate, "split"|"rosto"|"tela", "claro"|"tinta", zoom?]] — split põe o take no cartão
                (window.__video "cartao"); tela é só gráfico; rosto é o take inteiro (zoom opcional, corte seco)
       graficos [{t, ate, g, ...}] — o painel troca a cada substantivo. g: mascote (pose oi|ok, chip, chip_t,
                cor, confete) · term (titulo, linhas, lt, mascote) · fluxo (topo, meio, base[], t_meio, t_base)
                · pagina (url, legenda, marca, marca_t) · lista (titulo, itens[], passo) · email (titulo, linhas[], novo, novo_t)
       marca    o desenho em pixel do mascote (no mascote, no term, no fluxo, na pagina e no email):
                robo (padrão) ou ninja, o do dono — os planos dele passam "marca":"ninja"; o desenho do ninja
                mora em nucleo/marca-ninja.js, que não vai pro aluno: sem ele, sai o robô
       fala     [[palavra, t0, t1]] — vira cartão de 1–2 palavras, corte seco, e acumula recentrando;
                "então|" força a quebra depois da palavra
       vozes    [{t, ate, rotulo}] · [{t, t2, ate, bloco: [l1, l2], cor}] · [{t, t2, ate, titulo: [l1, l2]}]
                · [{t, t2, ate, chamada: [l1, l2]}] — a fala cala dentro da janela de cada voz
       cartao   {escala, topo} — como o take cabe no cartão (escala do take, y do topo dele)
       camera   {deriva, empurra: [t]} — o rosto não para entre os cortes: cada cena de rosto aproxima
                `deriva` (1,3 %) por segundo, reto, até 5 %, e cada t de `empurra` (uma peça entrando por
                cima) dá um empurrão de 2,5 % que volta em 1,5 s. Sem camera, parado entre os cortes
     ?r={"dur":4,"cenas":[[0,2.2,"split","claro"],[2.2,4,"rosto"]],"graficos":[{"t":0,"ate":2.2,"g":"mascote","pose":"oi","chip":"compra aprovada","chip_t":0.9,"cor":"ok"}],"fala":[["Parabéns",0.1,0.5],["pela",0.5,0.7],["sua",0.7,0.9],["compra.",0.9,1.3]],"vozes":[{"t":1.4,"ate":2.2,"rotulo":"Agente de IA"},{"t":2.3,"t2":2.7,"ate":4,"chamada":["comenta","“AGENTE”"]}]} -->
<html lang="pt-BR" class="alfa" data-qa="entra-seco fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/editorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/ensaio.js"></script>
<!-- o ninja é a marca do dono: o desenho só carrega quando o r pede, e o arquivo não vai pro aluno -->
<script>if (JSON.parse(D.q('r', '') || '{}').marca === 'ninja') document.write('<script src="../nucleo/marca-ninja.js"><\/script>');</script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block;position:relative;overflow:hidden}
#tras,#frente{position:absolute;inset:0}
</style>
</head>
<body>
<div id="stage">
  <div id="tras" data-c="tras"></div>
  <div id="frente" data-c="frente"></div>
</div>
<script>
const EX = {dur: 4, cenas: [[0, 2.2, 'split', 'claro'], [2.2, 4, 'rosto']],
  graficos: [{t: 0, ate: 2.2, g: 'mascote', pose: 'oi', chip: 'compra aprovada', chip_t: .9, cor: 'ok'}],
  fala: [['Parabéns', .1, .5], ['pela', .5, .7], ['sua', .7, .9], ['compra.', .9, 1.3]],
  vozes: [{t: 1.4, ate: 2.2, rotulo: 'Agente de IA'}, {t: 2.3, t2: 2.7, ate: 4, chamada: ['comenta', '“AGENTE”']}]};
const R = D.q('r', '') ? JSON.parse(D.q('r', '')) : EX;   // JSON ruim derruba a peça: melhor que render errado
const tk = n => parseFloat(D.css(n));
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const $ = s => document.querySelector(s);
const el = (pai, cls, html = '') => { const e = document.createElement('div'); e.className = cls; e.innerHTML = html; pai.appendChild(e); return e; };

// ── cenas ──
const CENAS = (R.cenas || []).map(([de, ate, modo, tema, zoom]) => ({de, ate, modo, tema: tema || 'claro', zoom}));
const ROSTO = {modo: 'rosto', tema: 'claro'};
const cena = t => CENAS.find(c => t >= c.de - 1e-4 && t < c.ate - 1e-4) || ROSTO;
const cortes = [...new Set(CENAS.flatMap(c => [c.de, c.ate]))];
const noCorte = t => cortes.some(c => Math.abs(c - t) < .02);
const fins = [...CENAS.map(c => c.ate), ...(R.graficos || []).map(g => g.ate), ...(R.vozes || []).map(v => v.ate),
  ...(R.fala || []).map(w => w[2] + .4)];
const DUR = R.dur || Math.max(1, ...fins);
const Y = {split: tk('--ed-y-costura'), rosto: tk('--ed-y-rosto'), tela: tk('--ed-y-tela')};
const GY = {split: tk('--ed-g-split'), tela: tk('--ed-g-tela'), rosto: tk('--ed-g-split')};
const sobre = c => c.modo === 'rosto' ? 'sobre-rosto' : c.tema === 'tinta' ? 'sobre-tinta' : 'sobre-claro';
// o que a cena pede da letra: sobre claro a tinta é escura; sobre tinta e rosto, branca
const escuro = c => c.modo !== 'rosto' && c.tema !== 'tinta';

// o take no cartão: centrado, com o topo em `topo` e a escala que enche a largura do cartão
const cx = tk('--ed-cartao-x'), cy = tk('--ed-cartao-y');
const CARTAO = {x: cx, y: cy, w: 1080 - 2 * cx, h: 1920 - cy, raio: tk('--ed-cartao-raio'),
  escala: (R.cartao || {}).escala ?? (1080 - 2 * cx) / 1080, topo: (R.cartao || {}).topo ?? 400};

// ── o mascote em pixel: a `marca` escolhe o desenho; 12×12, as cores no editorial.css ──
const MARCAS = {
  robo: {
    ok: ['.....YY.....', '.....BB.....', '...BBBBBB...', '...BWWWWB...', '...BKWWKB...', '...BWWWWB...',
         '...BBBBBB...', '....BBBB....', '.BBBBBBBBBB.', 'B.BBYYYYBB.B', 'B.BBBBBBBB.B', '..BBB..BBB..'],
    oi: ['.....YY.....', '.....BB....B', '...BBBBBB..B', '...BWWWWB..B', '...BKWWKB..B', '...BWWWWB..B',
         '...BBBBBB..B', '....BBBB..B.', '.BBBBBBBBB..', 'B.BBYYYYBB..', 'B.BBBBBBBB..', '..BBB..BBB..'],
    oi2: ['.....YY.....', '.....BB...BB', '...BBBBBB.B.', '...BWWWWB.B.', '...BKWWKB.B.', '...BWWWWB.B.',
          '...BBBBBB.B.', '....BBBB.B..', '.BBBBBBBBB..', 'B.BBYYYYBB..', 'B.BBBBBBBB..', '..BBB..BBB..'],
  },
  // o do dono (a marca dele): só com "marca":"ninja" no r, e o desenho vem do núcleo (nucleo/marca-ninja.js)
  ninja: window.MARCA_NINJA,
};
// sem o arquivo do ninja (o kit do aluno), o ninja pedido sai robô em vez de derrubar a peça
const POSES = MARCAS[R.marca || 'robo'] || (R.marca === 'ninja' ? MARCAS.robo : null);
if (!POSES) throw new Error('marca desconhecida: ' + R.marca + ' (há: ' + Object.keys(MARCAS).join(', ') + ')');
// o mascote vive em dois quadros, no passo do pixel: acena (oi ↔ oi2) ou quica 1 pixel (ok)
function vive(tl, r, t, ate, pose) {
  const q = r.querySelectorAll('.nj > svg');
  if (pose === 'oi' && q.length === 2) {
    for (let k = t + .28, i = 0; k < ate; k += .28, i++) { tl.set(q[0], {opacity: i % 2 ? 1 : 0}, k); tl.set(q[1], {opacity: i % 2 ? 0 : 1}, k); }
  } else if (q.length) {
    const p = q[0].getBBox ? q[0].clientHeight / 12 : 0;
    for (let k = t + .5, i = 0; k < ate; k += .4, i++) tl.set(q[0], {y: i % 2 ? 0 : -p}, k);
  }
}
function pixel(p, pose = 'ok') {
  const g = POSES[pose] || POSES.ok;
  let r = '';
  g.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '.') r += `<rect class="px-${c}" x="${x}" y="${y}" width="1.03" height="1.03"/>`; }));
  return `<svg width="${g[0].length * p}" height="${g.length * p}" viewBox="0 0 ${g[0].length} ${g.length}" shape-rendering="crispEdges">${r}</svg>`;
}
const CURSOR = '<svg width="64" height="78" viewBox="0 0 16 19.5"><path d="M1 1 L1 16 L5 12.5 L8 18.5 L10.5 17.3 L7.6 11.4 L13 11.2 Z" style="fill:var(--pp);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round"/></svg>';

// ── os gráficos: cada tipo devolve o HTML e o que anima dentro da janela dele ──
const G = {
  mascote(g) {
    const p = g.p || 32, cf = g.confete ? Array.from({length: 14}, (_, i) => `<i class="ed-cf ${i % 2 ? 'a' : 'm'}"></i>`).join('') : '';
    const chips = g.chip ? String(g.chip).split('|') : [];
    return {html: `<div class="ed-pilha" style="display:flex;flex-direction:column;align-items:center;gap:40px">
        <div class="nj" style="line-height:0;position:relative">${cf}${pixel(p, g.pose)}${g.pose === 'oi' ? pixel(p, 'oi2').replace('<svg', '<svg style="position:absolute;left:0;top:0;opacity:0"') : ''}</div>
        ${chips.map((c, i) => `<div class="nb ed-chip ${g.cor ? 'cor-' + g.cor : ''} chip" style="${i ? 'position:absolute;bottom:0' : ''}">${esc(c)}</div>`).join('')}</div>`,
      anima(tl, t, ate, r) {
        tl.fromTo(r.querySelector('.nj'), {y: 46}, {y: 0, duration: .42, ease: 'back.out(2.6)'}, t);
        vive(tl, r, t + .4, ate, g.pose);
        r.querySelectorAll('.ed-cf').forEach((c, i) => {
          const a = i / 14 * Math.PI * 2 + .3, d = 230 + (i % 3) * 70;
          tl.fromTo(c, {x: -11, y: -11, opacity: 1, rotation: 0}, {x: Math.cos(a) * d - 11, y: Math.sin(a) * d * .8 - 11,
            rotation: 180 + i * 40, duration: .9, ease: 'power3.out'}, t + .05);
          tl.to(c, {opacity: 0, duration: .25}, t + .7);
        });
        const cs = r.querySelectorAll('.chip');
        cs.forEach((c, i) => {
          const tc = (g.chip_t ?? t + .3) + i * (g.chip_passo || .5);
          if (i === 0) D.pousa(c, tc, {rot: -1.5});
          else { tl.set(c, {opacity: 0}, 0); tl.set(c, {opacity: 1}, tc); }
          if (i + 1 < cs.length) tl.set(c, {opacity: 0}, (g.chip_t ?? t + .3) + (i + 1) * (g.chip_passo || .5));
        });
      }};
  },
  term(g) {
    const ls = g.linhas || [];
    return {html: `<div class="ed-pilha">${g.mascote ? `<div class="nj-topo">${pixel(13, 'ok')}</div>` : ''}
        <div class="ed-jan ed-term"><div class="bar"><i style="background:var(--no)"></i><i style="background:var(--mk)"></i><i style="background:var(--ok)"></i><span style="margin-left:14px">${esc(g.titulo || 'terminal — zsh')}</span></div>
        <div class="corpo">${ls.map((l, i) => `<div class="ln">${l}${i === ls.length - 1 ? ' <span class="car"></span>' : ''}</div>`).join('')}</div></div></div>`,
      anima(tl, t, ate, r) {
        const nt = r.querySelector('.nj-topo');
        if (nt) tl.fromTo(nt, {y: 40}, {y: 0, duration: .4, ease: 'back.out(2.4)'}, t + .1);
        const car = r.querySelector('.car'), tf = (g.lt || [])[ls.length - 1] ?? t + .2 + (ls.length - 1) * (g.passo || .35);
        if (car) for (let k = tf + .3, i = 0; k < ate; k += .35, i++) tl.set(car, {opacity: i % 2 ? 0 : 1}, k);
        r.querySelectorAll('.ln').forEach((l, i) => {
          const ti = (g.lt || [])[i] ?? t + .2 + i * (g.passo || .35), n = l.textContent.length;
          tl.set(l, {opacity: 1}, ti);
          tl.fromTo(l, {clipPath: 'inset(0 100% 0 0)'}, {clipPath: 'inset(0 0% 0 0)', duration: Math.min(.5, n * .022), ease: `steps(${Math.max(1, n)})`}, ti);
        });
      }};
  },
  fluxo(g) {
    const base = g.base || [], xs = base.map((_, i) => 450 + (i - (base.length - 1) / 2) * 300);
    const ramos = xs.map(x => `<path class="rm" d="M450 300 C450 350 ${x} 320 ${x} 372"/>`).join('');
    return {html: `<div class="ed-fluxo">
        <svg class="ln" viewBox="0 0 900 560"><path class="tr" d="M450 172 L450 222"/>${ramos}</svg>
        <div class="ed-no topo" style="left:450px;top:80px">${pixel(12, 'ok')}<span>${esc(g.topo || 'agente')}</span></div>
        <div class="ed-pilula meio" style="left:450px;top:262px">${esc(g.meio || 'sua equipe')}</div>
        ${base.map((b, i) => `<div class="ed-no bs" style="left:${xs[i]}px;top:460px">${pixel(8, 'ok')}<span>${esc(b)}</span></div>`).join('')}</div>`,
      anima(tl, t, ate, r) {
        const tm = g.t_meio ?? t + .45, tb = g.t_base ?? t + .85;
        gsap.set(r.querySelectorAll('.ed-no,.ed-pilula'), {xPercent: -50, yPercent: -50});
        const risca = (p, t0) => { const L = p.getTotalLength(); tl.fromTo(p, {strokeDasharray: L, strokeDashoffset: L}, {strokeDashoffset: 0, duration: .3, ease: 'power2.out'}, t0); };
        tl.fromTo(r.querySelector('.topo'), {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: .3, ease: 'power2.out'}, t);
        risca(r.querySelector('.tr'), tm - .25);
        tl.fromTo(r.querySelector('.meio'), {opacity: 0, scale: .8}, {opacity: 1, scale: 1, duration: .3, ease: 'back.out(2)'}, tm);
        r.querySelectorAll('.rm').forEach((p, i) => risca(p, tb - .2 + i * .12));
        r.querySelectorAll('.bs').forEach((b, i) => tl.fromTo(b, {opacity: 0, y: 24}, {opacity: 1, y: 0, duration: .32, ease: 'back.out(2.2)'}, tb + i * .12));
      }};
  },
  pagina(g) {
    return {html: `<div class="ed-pilha"><div class="ed-jan ed-nav">
        <div class="bar"><i></i><i></i><i></i><span class="url">${esc(g.url || 'área de membros / boas-vindas')}</span></div>
        <div class="ed-play"><div style="position:absolute;left:44px;bottom:48px;opacity:.9">${pixel(7, 'oi')}</div><div class="tri"></div><div class="barra"><i></i></div>
        ${g.marca ? `<div class="ed-marca kick">${esc(g.marca)}</div>` : ''}</div></div>
        ${g.cursor ? `<div class="ed-cursor" style="left:520px;top:300px">${CURSOR}</div>` : ''}</div>
        ${g.legenda ? `<div class="ed-legenda-g">${esc(g.legenda)}</div>` : ''}`,
      anima(tl, t, ate, r) {
        tl.fromTo(r.querySelector('.barra i'), {width: '4%'}, {width: (g.progresso || 38) + '%', duration: ate - t, ease: 'none'}, t);
        const m = r.querySelector('.ed-marca');
        if (m) tl.fromTo(m, {opacity: 0, scale: .6, rotation: -6}, {opacity: 1, scale: 1, rotation: -3, duration: .35, ease: 'back.out(2.4)'}, g.marca_t ?? t + .4);
        const c = r.querySelector('.ed-cursor');
        if (c) {
          const tc = g.cursor_t ?? t + .3;
          tl.fromTo(c, {opacity: 0, x: 260, y: 160}, {opacity: 1, x: 0, y: 0, duration: .5, ease: 'power3.out'}, tc);
          tl.to(c, {scale: .86, duration: .07}, tc + .55).to(c, {scale: 1, duration: .12}, tc + .62);
        }
      }};
  },
  lista(g) {
    const it = g.itens || [];
    return {html: `<div class="nb ed-lista"><div class="kick">${esc(g.titulo || '')}</div>
        ${it.map(x => `<div class="it"><span class="ck"><i>✓</i></span><span>${esc(x)}</span></div>`).join('')}</div>`,
      anima(tl, t, ate, r) {
        D.pousa(r.querySelector('.ed-lista'), t + .05, {rot: -1});
        tl.fromTo(r.querySelector('.kick'), {opacity: 0}, {opacity: 1, duration: .12}, t + .06);
        r.querySelectorAll('.it').forEach((x, i) => {
          const ti = t + .1 + i * (g.passo || .3);
          tl.fromTo(x, {opacity: 0, x: -20}, {opacity: 1, x: 0, duration: .25, ease: 'power2.out'}, ti);
          tl.fromTo(x.querySelector('.ck i'), {opacity: 0, scale: .4}, {opacity: 1, scale: 1, duration: .22, ease: 'back.out(3)'}, ti + .18);
        });
      }};
  },
  email(g) {
    const ls = g.linhas || [];
    return {html: `<div class="ed-pilha"><div class="nj-topo">${pixel(10, 'ok')}</div><div class="nb ed-mail">
        <div class="cab">${esc(g.titulo || 'caixa de entrada')}<span>agora</span></div>
        ${g.novo ? `<div class="lin novo"><b></b>${esc(g.novo)}<em>novo</em></div>` : ''}
        ${ls.map(l => `<div class="lin"><b></b>${esc(l)}</div>`).join('')}</div></div>`,
      anima(tl, t, ate, r) {
        tl.fromTo(r.querySelector('.nj-topo'), {y: 36}, {y: 0, duration: .4, ease: 'back.out(2.4)'}, t + .1);
        const n = r.querySelector('.lin.novo');
        if (n) {
          const tn = g.novo_t ?? t + .5;
          tl.fromTo(n, {height: 0, paddingTop: 0, paddingBottom: 0, opacity: 0}, {height: 'auto', paddingTop: 24, paddingBottom: 24, opacity: 1, duration: .35, ease: 'power3.out'}, tn);
          D.cue(tn, 'notif');
        }
      }};
  },
};

// ── a fala: palavra com tempo → cartões de 1–2 palavras ──
const NOMES = new Set(R.nomes || ['IA', 'Claude', 'Code']);
const VOZ = (R.vozes || []).map(v => [v.t, v.ate]);
function cartoes() {
  const ws = [];
  for (const [tx, t0, t1] of R.fala || []) {
    if (tx.startsWith('-') && ws.length) { const w = ws[ws.length - 1]; w.tx += tx; w.t1 = t1; continue; }   // "bem" + "-vindo"
    ws.push({tx, t0, t1});
  }
  ws.forEach(w => {
    w.fim = /[.,;:!?|]$/.test(w.tx);     // "então|" no plano força a quebra ali
    w.tx = w.tx.replace(/\|$/, '');
    w.tx = w.tx.replace(/[.,;:]+$/, '');
    // como se fala: minúscula no começo da frase, nome próprio fica
    if (!NOMES.has(w.tx) && /^\p{Lu}\p{Ll}/u.test(w.tx)) w.tx = w.tx[0].toLowerCase() + w.tx.slice(1);
  });
  const livres = ws.filter(w => !VOZ.some(([a, b]) => w.t0 >= a - .05 && w.t0 < b));
  const cs = [];
  let cur = null;
  for (const w of livres) {
    const u = cur && cur.ws[cur.ws.length - 1];
    const junta = cur && cur.ws.length < 2 && !u.fim && w.t0 - u.t1 < .3 && cena(u.t0) === cena(w.t0)
      && (u.tx + ' ' + w.tx).length <= 15 && !VOZ.some(([a]) => a > u.t0 && a <= w.t0);
    if (junta) cur.ws.push(w); else cs.push(cur = {ws: [w]});
  }
  return cs;
}
// [a, b) partido nos cortes de cena
const pedacos = (a, b) => {
  const cs = [a, ...cortes.filter(c => c > a + 1e-3 && c < b - 1e-3), b];
  return cs.slice(1).map((x, i) => [cs[i], x, cena(cs[i])]);
};
// a letra não passa de 960 px (ou do --ed-max que a folha do anúncio põe, pra não entrar na coluna de botões):
// encolhe o corpo até caber
const maxw = () => parseFloat(D.css('--ed-max')) || 960;
const cabe = (e, max = maxw()) => { const w = e.scrollWidth; if (w > max) e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * max / w + 'px'; };
const lado = (e, c) => { e.style.top = Y[c.modo] + 'px'; e.classList.add(sobre(c)); };

// entra em fade curto (o que o Nick faz na serifa e no bloco); sai em corte se é corte de cena, senão num fade de 0,1 s
function janela(tl, e, t, ate, ent = .14) {
  tl.fromTo(e, {opacity: 0}, {opacity: 1, duration: ent, ease: 'none'}, t);
  if (noCorte(ate) || ate >= DUR - .01) tl.set(e, {opacity: 0}, ate); else tl.to(e, {opacity: 0, duration: .1, ease: 'none'}, ate - .1);
}

// as duas letras da voz editorial vêm do núcleo; a montagem só começa com elas carregadas
const SANS = D.css('--ed-sans').split(',')[0], SERIF = D.css('--ed-serif').split(',')[0];
window.__folha = Promise.all(['700 100px ' + SANS, '800 100px ' + SANS, 'italic 400 100px ' + SERIF]
  .map(f => document.fonts.load(f).catch(() => null)));

D.monta(tl => {
  const tras = $('#tras'), frente = $('#frente');
  // painel: papel (com a sombra de planta) ou tinta, ligado nas cenas split e tela
  const folhas = [[-160, -90, 560, 150, 32], [-60, 140, 420, 120, 58], [760, -40, 480, 130, -38], [820, 190, 360, 100, -62]]
    .map(([x, y, w, h, r]) => `<i class="folha" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg)"></i>`).join('');
  const painel = {claro: el(tras, 'ed-painel claro', folhas + '<div class="grao"></div>'), tinta: el(tras, 'ed-painel tinta', '<div class="grao"></div>')};
  for (const tema of ['claro', 'tinta']) {
    const on = CENAS.filter(c => c.modo !== 'rosto' && c.tema === tema).sort((a, b) => a.de - b.de);
    const jun = [];
    on.forEach(c => { const u = jun[jun.length - 1]; if (u && Math.abs(u[1] - c.de) < 1e-3) u[1] = c.ate; else jun.push([c.de, c.ate]); });
    jun.forEach(([a, b]) => { tl.set(painel[tema], {opacity: 1}, a); if (b < DUR - .01) tl.set(painel[tema], {opacity: 0}, b); });
  }
  const CAM = R.camera;
  CENAS.forEach(c => {
    if (c.modo === 'split') E.video(c.de, c.ate, 'cartao', CARTAO);
    // a câmera das referências anda 28–90 % do tempo; a nossa, 8–21 % (03/10)
    const z = c.zoom || 1, d = CAM ? Math.min(.05, (CAM.deriva ?? .013) * (c.ate - c.de)) : 0;
    if (c.modo === 'rosto' && (c.zoom || d)) E.video(c.de, c.ate, 'zoom', {de: z, para: +(z * (1 + d)).toFixed(4), entra: d ? c.ate - c.de : 0, curva: 'reta'});
  });
  (CAM?.empurra || []).forEach(t => E.video(Math.max(0, t - .1), Math.min(DUR, t + 1.9), 'empurra', {valor: .025}));

  // gráficos: entra em 0,3 s (opacidade + sobe 16 px + escala .97), deriva devagar, sai em 0,1 s
  (R.graficos || []).forEach(g => {
    const c = cena(g.t), mk = G[g.g];
    if (!mk) throw new Error('gráfico desconhecido: ' + g.g + ' (há: ' + Object.keys(G).join(', ') + ')');
    const m = mk(g), box = el(tras, 'ed-g ' + sobre(c), `<div class="gd"><div class="gi" style="display:flex;flex-direction:column;align-items:center">${m.html}</div></div>`);
    box.style.top = GY[c.modo] + 'px';
    const gi = box.querySelector('.gi');
    janela(tl, box, g.t, g.ate, .01);
    tl.fromTo(gi, {opacity: 0, y: 16, scale: .97}, {opacity: 1, y: 0, scale: 1, duration: .3, ease: 'power2.out'}, g.t);
    tl.fromTo(box.querySelector('.gd'), {y: 0}, {y: -12, duration: g.ate - g.t, ease: 'none'}, g.t);
    m.anima(tl, g.t, g.ate, gi);
  });

  // fala: corte seco, o cartão acumula a palavra dita e recentra
  cartoes().forEach((cd, i, cs) => {
    const ult = cd.ws[cd.ws.length - 1], prox = cs[i + 1];
    let fim = prox ? Math.min(prox.ws[0].t0, ult.t1 + .7) : ult.t1 + .5;
    VOZ.forEach(([a]) => { if (a > cd.ws[0].t0 && a < fim) fim = a; });
    fim = Math.min(fim, DUR);
    cd.ws.forEach((w, k) => {
      const a = w.t0, b = k + 1 < cd.ws.length ? cd.ws[k + 1].t0 : fim;
      if (b - a < .02) return;
      const tx = cd.ws.slice(0, k + 1).map(x => x.tx).join(' ');
      pedacos(a, b).forEach(([p0, p1, c]) => {
        if (p1 - p0 < 1 / 30) return;          // sobra de menos de um quadro depois do corte
        const e = el(frente, 'ed-v', `<div class="ed-fala">${esc(tx)}</div>`);
        lado(e, c); cabe(e.firstChild);
        tl.set(e, {opacity: 1}, p0); if (p1 < DUR - .01) tl.set(e, {opacity: 0}, p1);
      });
    });
  });

  // as outras vozes
  (R.vozes || []).forEach(v => {
    const c = cena(v.t), t2 = v.t2 ?? v.t + .4;
    if (v.rotulo) {
      const e = el(frente, 'ed-v', `<div class="ed-rot">${esc(v.rotulo)}</div>`);
      lado(e, c); cabe(e.firstChild); janela(tl, e, v.t, v.ate, .12);
    } else if (v.bloco) {
      // linha 1 em sans; a 2 chega em serifa por cima e a 1 apaga pra baixo (degradê), sem sair
      const cor = v.cor || 'ouro', apaga = escuro(c) ? 'apaga-tx' : 'apaga';
      const e = el(frente, 'ed-v', `<div style="position:relative"><div class="ed-b1 l1a">${esc(v.bloco[0])}</div>
        <div class="ed-b1 ed-dg ${apaga} l1b" style="position:absolute;inset:0;opacity:0">${esc(v.bloco[0])}</div></div>
        <div class="ed-b2 ed-dg ${cor} ${escuro(c) ? '' : 'ed-sob'} l2" style="opacity:0">${esc(v.bloco[1])}</div>`);
      lado(e, c);
      if (escuro(c)) e.querySelector('.l1a').style.color = 'var(--ed-tx)';
      else e.querySelector('.l1a').style.textShadow = 'var(--ed-sombra)';
      e.querySelectorAll('.ed-b1,.ed-b2').forEach(x => cabe(x));
      janela(tl, e, v.t, v.ate, .15);
      tl.set(e.querySelector('.l2'), {opacity: 1}, t2);
      tl.set(e.querySelector('.l1a'), {opacity: 0}, t2);
      tl.set(e.querySelector('.l1b'), {opacity: 1}, t2);
    } else if (v.titulo) {
      // caixa alta com degradê que some pra baixo; a 2ª linha espaçada (U S A G E) entra depois
      const dg = c.tema === 'tinta' ? 'some-ouro' : 'some-azul';
      const e = el(frente, 'ed-v', `<div class="ed-tit ed-dg ${dg} l1">${esc(v.titulo[0])}</div><div class="ed-tit esp ed-dg ${dg} l2">${esc(v.titulo[1] || '')}</div>`);
      lado(e, c);
      e.querySelectorAll('.ed-tit').forEach(x => cabe(x, Math.min(940, maxw())));
      tl.set(e, {opacity: 1}, v.t);
      tl.fromTo(e.querySelector('.l1'), {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: .3, ease: 'power2.out'}, v.t);
      tl.fromTo(e.querySelector('.l2'), {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: .3, ease: 'power2.out'}, t2);
      if (v.ate < DUR - .01) tl.set(e, {opacity: 0}, v.ate);
    } else if (v.chamada) {
      // o flash quente abre; a 1ª em serifa, a palavra-chave em sans por cima; parada até o fim
      const lk = el(frente, 'ed-leak');
      tl.fromTo(lk, {opacity: 0}, {opacity: 1, duration: .07, ease: 'none'}, v.t - .04)
        .to(lk, {opacity: .3, duration: .07, ease: 'none'}, v.t + .03)
        .to(lk, {opacity: .9, duration: .06, ease: 'none'}, v.t + .1)
        .to(lk, {opacity: 0, duration: .2, ease: 'power1.out'}, v.t + .16);
      const e = el(frente, 'ed-v', `<div class="ed-c1 ed-dg cromo ed-sob l1">${esc(v.chamada[0])}</div><div class="ed-c2 ed-dg cromo ed-sob l2">${esc(v.chamada[1])}</div>`);
      lado(e, c);
      e.querySelectorAll('.ed-c1,.ed-c2').forEach(x => cabe(x));
      tl.set(e, {opacity: 1}, v.t);
      tl.fromTo(e.querySelector('.l1'), {opacity: 0}, {opacity: .92, duration: .15, ease: 'none'}, v.t + .05);
      tl.fromTo(e.querySelector('.l2'), {opacity: 0}, {opacity: 1, duration: .06, ease: 'none'}, t2);
      if (v.ate < DUR - .01) tl.set(e, {opacity: 0}, v.ate);
    }
  });
  return DUR;
});
</script>
</body>
</html>
