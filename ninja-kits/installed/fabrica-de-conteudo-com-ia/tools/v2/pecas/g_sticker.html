<!DOCTYPE html>
<!-- GANCHO — sticker que salta. 1080x1920, --alpha.
     Recorte branco com borda e sombra dura, emoji ou texto curto dentro. Nasce
     pequeno e assenta sem passar do ponto, balança uma vez, flutua, e sai estourando.
     Um ou vários: glifo|x|y|rotação|legenda@t, separados por ;
       ?st=🔥|800|520|-8@0.2;💸|260|1360|7|dinheiro parado@0.9&tam=170&dur=4 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.stk{position:absolute;display:flex;flex-direction:column;align-items:center;gap:14px;opacity:0}
.stk .gl{display:flex;align-items:center;justify-content:center;padding:.14em .2em;border-radius:calc(var(--raio)*2);
  font-size:var(--tam,170px);line-height:1;font-family:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',var(--fd);font-weight:700}
.stk .lg{padding:12px 20px;font:700 36px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;border-radius:var(--raio-s);white-space:nowrap}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const dur = D.n('dur', '4');
document.documentElement.style.setProperty('--tam', D.q('tam', '170') + 'px');
const st = D.itens('st', '🔥|800|520|-8@0.2;💸|260|1360|7|dinheiro parado@0.9', ['gl', 'x', 'y', 'rot', 'lg']);
const stage = document.getElementById('stage');
st.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'stk'; d.id = 'sk' + i;
  d.innerHTML = `<span class="gl nb">${s.gl}</span>${s.lg ? `<span class="lg nb cor-ink">${s.lg}</span>` : ''}`;
  stage.appendChild(d);
});

D.monta(tl => {
  st.forEach((s, i) => {
    const el = document.getElementById('sk' + i);
    // centra o recorte no ponto pedido e segura dentro do quadro
    const w = el.offsetWidth, h = el.offsetHeight;
    el.style.left = Math.max(30, Math.min(1080 - 30 - w, (+s.x || 540) - w / 2)) + 'px';
    el.style.top = Math.max(60, Math.min(1920 - 60 - h, (+s.y || 960) - h / 2)) + 'px';
    const rot = parseFloat(s.rot) || 0;
    // sem mola: o elastic passava 31 % do tamanho e sacudia 4 vezes, e a figurinha seguinte entrava
    // com a anterior ainda balançando (03/10)
    tl.fromTo(el, {opacity: 0, scale: .6, rotation: rot - 12}, {opacity: 1, scale: 1, rotation: rot, duration: .45, ease: D.P.POUSA}, D.at(s.t));
    D.cue(s.t, 'pop');
    tl.to(el, {rotation: rot + 4, duration: .14, ease: 'sine.inOut', yoyo: true, repeat: 1}, D.at(s.t) + .45);
    D.flutua(el, s.t + .8, dur - .5, 3, i);
    if (D.q('sai', '1') !== '0') tl.to(el, {scale: 0, rotation: rot + 25, opacity: 0, duration: .3, ease: 'back.in(2)'}, dur - .45 + i * .05);
  });
  if (D.q('sai', '1') !== '0') D.cue(dur - .45, 'whoosh-out');
  return dur;
});
</script>
</body>
</html>
