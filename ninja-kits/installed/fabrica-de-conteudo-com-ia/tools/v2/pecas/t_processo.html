<!DOCTYPE html>
<!-- TIPO — o processo que fica, v2. 1440x1028.
     Duas fichas e uma ponte. A primeira NÃO sai quando a segunda entra — é a
     permanência. O "Salvo" é carimbo: bate torto na ficha. Com agenda=3, três
     marcas nascem sobre a ponte e uma acende em amarelo.
       ?de=Seu processo&de_det=escrito uma vez&para=Próxima execução
        &para_det=já sabe o caminho&salvo=Salvo&agenda=3&dur=5.5 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1440px;height:1028px}
#stage{padding:44px var(--marg);justify-content:center}
.hd{font-size:74px;margin-bottom:40px}
.trilho{display:flex;align-items:stretch}
.fx{flex:1;min-width:0;padding:32px 34px;opacity:0;position:relative}
.rodape{display:flex;align-items:center;gap:18px;margin-top:12px}
.fx .nm{font:900 54px/1.06 var(--fd);color:var(--ink);letter-spacing:var(--ls);white-space:nowrap}
.fx .de{font:600 var(--piso)/1.2 var(--fd);color:var(--ink6);white-space:nowrap}
.selo{position:absolute;right:-18px;top:-30px;display:inline-flex;align-items:center;gap:10px;
  padding:10px 20px;opacity:0;border-radius:var(--raio-s)}
.selo b{font:800 30px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase}
.selo i{font:900 26px/1 var(--fd);font-style:normal}
.ponte{width:190px;flex:none;position:relative;display:flex;align-items:center}
.ponte .fio{height:12px;width:100%;background:var(--ink);transform-origin:left center}
.ponte .marcas{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-around;padding:0 22px}
.ponte .mc{width:30px;height:30px;border-radius:50%;background:var(--sur);border:var(--bw) solid var(--ink);opacity:0;flex:none}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="hd" id="h"></div>
  <div class="trilho">
    <div class="nb fx" id="a">
      <div class="nm" id="an"></div>
      <div class="rodape"><div class="de" id="ad"></div></div>
      <span class="selo nb cor-mk" id="sl"><i>✓</i><b id="slb"></b></span>
    </div>
    <div class="ponte"><div class="fio" id="fio"></div><div class="marcas" id="mcs"></div></div>
    <div class="nb fx" id="b">
      <div class="nm" id="bn"></div><div class="rodape"><div class="de" id="bd"></div></div>
    </div>
  </div>
</div>
<script>
const dur = D.n('dur', '5.5');
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('h').innerHTML = D.q('hd', '');
document.getElementById('an').textContent = D.q('de', 'Seu processo');
document.getElementById('ad').textContent = D.q('de_det', '');
document.getElementById('bn').textContent = D.q('para', 'Próxima execução');
document.getElementById('bd').textContent = D.q('para_det', '');
document.getElementById('slb').textContent = D.q('salvo', 'Salvo');
const nMarcas = parseInt(D.q('agenda', '0'), 10);
const mcs = document.getElementById('mcs');
for (let i = 0; i < nMarcas; i++) {
  const d = document.createElement('div'); d.className = 'mc'; d.id = 'mc' + i; mcs.appendChild(d);
}
const tA = D.n('t_a', '0.10'), tS = D.n('t_selo', '1.90'), tL = D.n('t_linha', '2.86'), tB = D.n('t_b', '3.28');

D.monta(tl => {
  D.cabe('.hd', 44);
  D.cabe('.fx .nm', 34, '.fx');
  D.cabe('.fx .de', 26, '.fx');
  D.camera(dur, 1.0, 1.025);
  if (D.q('kick')) D.carimbo('#k', .06);
  if (D.q('hd')) D.titulo('#h', .18);
  D.pousa('#a', tA, {dx: -36, rot: D.inclina(0) * .5});
  if (D.q('salvo')) D.carimbo('#sl', tS, D.P.ROT - 3);
  tl.fromTo('#fio', {scaleX: 0}, {scaleX: 1, duration: .42, ease: D.P.EASE}, D.at(tL));
  for (let i = 0; i < nMarcas; i++) {
    tl.fromTo('#mc' + i, {opacity: 0, scale: .3}, {opacity: 1, scale: 1, duration: .3, ease: 'back.out(2.4)'}, tL + .12 + i * .14);
  }
  D.pousa('#b', tB, {dx: 36, rot: D.inclina(1) * .5});
  if (nMarcas > 1) {
    tl.to('#mc1', {backgroundColor: D.css('--mk'), scale: 1.35, duration: .22, ease: 'back.out(3)'}, tB + .6);
    tl.to('#mc1', {scale: 1, duration: .3, ease: D.P.EASE}, tB + .82);
  }
  D.sai(['#k', '#h', '#a', '.ponte', '#b'], dur - .45);
  return dur;
});
</script>
</body>
</html>
