<!DOCTYPE html>
<!-- DADO — a linha que cresce. 1080x1920 ou 1920x1080 (?ar=), --alpha.
     A linha se desenha da esquerda pra direita, a ponta carrega o valor contando
     (no rótulo que a segue e no número grande), cada ponto estala quando a ponta
     passa, e no fim o crescimento total bate como selo. O eixo começa no zero.
       ?pts=12,18,15,26,31,44,58&x=jan,fev,mar,abr,mai,jun,jul&rot=faturamento&pre=R$ &suf=k&t0=0.2&dl=2.4&dur=5.5 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html,body{background:transparent}
#stage{position:relative;overflow:hidden;background:none;padding:0;display:block}
.cd{position:absolute;left:60px;top:430px;width:960px;height:1020px;padding:46px 50px 40px;box-sizing:border-box;opacity:0}
html.h .cd{left:210px;top:110px;width:1500px;height:860px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.rot{font:700 28px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;padding:12px 16px 10px;border-radius:var(--raio-s)}
.vl{font:700 118px/.9 var(--fd);letter-spacing:-.05em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.gr{position:absolute;left:60px;right:60px;top:270px;bottom:100px}
html.h .gr{top:240px}
.gr svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gl{stroke:var(--ink2);stroke-width:3;stroke-dasharray:10 12}
.ar{fill:var(--ac2)}
.ln{fill:none;stroke:var(--ink);stroke-width:10;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--mk);stroke:var(--ink);stroke-width:6}
.xl{position:absolute;bottom:-60px;font:600 24px/1 var(--fm);color:var(--ink6);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pn{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--ac);border:6px solid var(--ink);box-sizing:border-box}
.tg{position:absolute;padding:10px 14px 8px;font:700 30px/1 var(--fm);white-space:nowrap;color:var(--mk);border-radius:var(--raio-s)}
.selo{position:absolute;right:80px;bottom:160px;padding:16px 24px 12px;font:700 60px/1 var(--fd);letter-spacing:-.03em;border-radius:var(--raio);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="cd nb" id="cd">
    <div class="cab"><span class="rot nb cor-ink" id="rt"></span><span class="vl" id="vl"></span></div>
    <div class="gr" id="gr"><svg id="sv"></svg></div>
    <div class="selo nb cor-mk" id="se"></div>
  </div>
</div>
<script>
const R = document.documentElement, HZ = D.q('ar', '1080x1920').startsWith('1920');
if (HZ) R.classList.add('h');
const t0 = D.n('t0', '0.2'), dl = D.n('dl', '2.4');
const vs = D.q('pts', '12,18,15,26,31,44,58').split(',').map(Number).filter(v => !isNaN(v));
const xs = D.q('x', 'jan,fev,mar,abr,mai,jun,jul').split(',');
const pre = D.q('pre', 'R$ '), suf = D.q('suf', 'k');
const dur = Math.max(t0 + dl + 1.6, D.n('dur', '5.5'));
const casas = vs.some(v => v % 1) ? 1 : 0;
const fmt = v => pre + v.toLocaleString('pt-BR', {minimumFractionDigits: casas, maximumFractionDigits: casas}) + suf;
document.getElementById('rt').textContent = D.q('rot', 'faturamento');
const cresc = vs[0] ? Math.round((vs[vs.length - 1] - vs[0]) / vs[0] * 100) : 0;
document.getElementById('se').textContent = D.q('selo', (cresc >= 0 ? '+' : '') + cresc + '%');
const inv = y => y < .5 ? Math.sqrt(y / 2) : 1 - Math.sqrt((1 - y) / 2);   // inversa do power1.inOut
D.monta(tl => {
  const gr = document.getElementById('gr'), sv = document.getElementById('sv'), cw = gr.clientWidth, ch = gr.clientHeight;
  const topo = Math.max(...vs) * 1.15 || 1, n = vs.length;
  const P = vs.map((v, i) => [i / Math.max(1, n - 1) * cw, ch - v / topo * ch]);
  const NS = 'http://www.w3.org/2000/svg', mk = (t, a, pai = sv) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); pai.appendChild(e); return e; };
  [0, .5, 1].forEach((f, k) => mk('line', {class: 'gl', id: 'gl' + k, x1: 0, x2: cw, y1: ch * f, y2: ch * f}));
  const dP = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const cr = mk('rect', {x: -20, y: -60, width: 0, height: ch + 80}, mk('clipPath', {id: 'cl'}));
  mk('path', {class: 'ar', d: dP + ` L${cw} ${ch} L0 ${ch} Z`, 'clip-path': 'url(#cl)'});
  const ln = mk('path', {class: 'ln', d: dP}), L = ln.getTotalLength() || 1;
  ln.style.strokeDasharray = L; ln.style.strokeDashoffset = L;
  const pts = P.map(p => mk('circle', {class: 'pt', cx: p[0], cy: p[1], r: 13}));
  let acc = 0; const Ls = P.map((p, i) => i ? (acc += Math.hypot(p[0] - P[i - 1][0], p[1] - P[i - 1][1])) : 0);
  xs.slice(0, n).forEach((x, i) => { const e = document.createElement('span'); e.className = 'xl'; e.style.left = P[i][0] + 'px'; e.textContent = x; gr.appendChild(e); });
  gsap.set('.xl', {xPercent: -50});
  const pn = document.createElement('div'); pn.className = 'pn'; gr.appendChild(pn);
  const tg = document.createElement('div'); tg.className = 'tg nb cor-ink'; gr.appendChild(tg);
  gsap.set(tg, {xPercent: -50, yPercent: -100});
  const vl = document.getElementById('vl'), o = {p: 0}, ta = D.at(t0) + .45;
  const aplica = () => {
    const pt = ln.getPointAtLength(L * o.p);
    ln.style.strokeDashoffset = L * (1 - o.p); cr.setAttribute('width', pt.x + 20);
    const xf = Math.min(n - 1, pt.x / cw * (n - 1)), i = Math.floor(xf), f = xf - i;
    const v = i >= n - 1 ? vs[n - 1] : vs[i] + (vs[i + 1] - vs[i]) * f;
    vl.textContent = tg.textContent = fmt(casas ? Math.round(v * 10) / 10 : Math.round(v));
    pn.style.left = pt.x + 'px'; pn.style.top = pt.y + 'px';
    tg.style.left = Math.max(70, Math.min(cw - 70, pt.x)) + 'px'; tg.style.top = (pt.y - 36) + 'px';
  };
  aplica();
  D.pousa('#cd', t0, {rot: 0, dr: 0, dy: -40, som: 'pop'});
  D.carimbo('#rt', t0 + .15, D.P.ROT);
  tl.fromTo(['#gl0', '#gl1', '#gl2'], {opacity: 0}, {opacity: 1, duration: .3, stagger: .06}, D.at(t0) + .2);
  tl.fromTo('.xl', {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: .3, stagger: .05, ease: D.P.EASE}, D.at(t0) + .25);
  tl.fromTo([pn, tg], {opacity: 0, scale: .4}, {opacity: 1, scale: 1, duration: .3, ease: D.P.MOLA}, ta - .1);
  tl.to(o, {p: 1, duration: dl, ease: 'power1.inOut', onUpdate: aplica}, ta);
  D.cue(ta, 'tick-roll', {dur: +dl.toFixed(3)});
  pts.forEach((c, i) => tl.fromTo(c, {scale: 0, transformOrigin: '50% 50%'}, {scale: 1, duration: .3, ease: 'back.out(3)'}, Math.max(0, ta + dl * inv(Ls[i] / L) - .04)));
  D.carimbo('#se', ta + dl + .15, -4);
  D.respira(pn, ta + dl + .2, dur - .5, 1.18);
  D.sai('#cd', dur - .45);
  return dur;
});
</script>
</body>
</html>
