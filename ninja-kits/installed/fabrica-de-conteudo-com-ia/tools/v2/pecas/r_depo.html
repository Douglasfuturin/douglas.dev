<!DOCTYPE html>
<!-- PROVA — depoimento. 1440x1028 (painel 40%) ou ?ar=1080x1920.
     Foto real (?img=), aspa amarela que bate, a fala sobe por palavra e o
     trecho que importa leva o grifo. Nome e o que a pessoa faz embaixo.
       ?img=aluno.jpg&cit=Em duas semanas o suporte <b>parou de ser meu</b>.&nome=Ana Souza&quem=loja de cosméticos&dur=6 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1440px;height:1028px}
#stage{padding:60px var(--marg);justify-content:center}
.dp{display:grid;grid-template-columns:300px minmax(0,1fr);gap:56px;align-items:start}
.fc{position:relative}
.foto{position:relative;width:300px;height:300px;overflow:hidden;opacity:0}
.aspa{position:absolute;left:-26px;top:-30px;width:104px;height:104px;display:flex;align-items:center;justify-content:center;
  font:700 120px/1 var(--fd);padding-top:44px;opacity:0;z-index:2}
.cit{font:700 var(--tam,62px)/1.14 var(--fd);letter-spacing:var(--ls);color:var(--ink);opacity:0}
.cit b{font-weight:inherit;padding:0 .08em;background:linear-gradient(var(--mk),var(--mk)) no-repeat 0 60%/0% 88%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.quem{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:36px}
.quem b{font:700 44px/1 var(--fd);letter-spacing:var(--ls);opacity:0}
.quem span{padding:12px 18px;font:700 28px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;border-radius:var(--raio-s);opacity:0}
.quem span:empty{display:none}
html.v,html.v body,html.v #stage{width:1080px;height:1920px}
html.v #stage{padding:0 70px}
html.v .dp{grid-template-columns:minmax(0,1fr);gap:60px}
html.v .foto{width:340px;height:340px}
html.v .cit{font-size:var(--tam,76px)}
</style>
</head>
<body>
<div id="stage">
  <div class="dp">
    <div class="fc"><div class="foto nb" id="fo"></div><div class="aspa nb cor-mk" id="as" data-qa="ignora">“</div></div>
    <div><div class="cit" id="ct"></div><div class="quem"><b id="nm"></b><span class="nb cor-ink" id="qm"></span></div></div>
  </div>
</div>
<script>
const dur = D.n('dur', '6');
if (D.q('tam')) document.documentElement.style.setProperty('--tam', D.q('tam') + 'px');
D.midia('#fo', D.q('img'), 'foto');
document.getElementById('ct').innerHTML = D.q('cit', 'Em duas semanas o suporte <b>parou de ser meu</b>.');
document.getElementById('nm').textContent = D.q('nome', 'Nome da pessoa');
document.getElementById('qm').textContent = D.q('quem', 'o que ela faz');

D.monta(tl => {
  D.camera(dur, 1.0, 1.02);
  D.pousa('#fo', .15, {rot: D.P.ROT, s: 1.06, som: 'pop'});
  D.carimbo('#as', .45, -6);
  const ws = D.palavras('#ct', .55, .045);
  const fim = .55 + ws.length * .045;
  D.marca('#ct b', fim + .1);
  D.entra('#nm', fim + .35, 16);
  if (D.q('quem', 'o que ela faz')) D.carimbo('#qm', fim + .55, D.P.ROT);
  D.sai(['.fc', '#ct', '.quem'], dur - .45);
  return dur;
});
</script>
</body>
</html>
