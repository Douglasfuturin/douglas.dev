<!DOCTYPE html>
<!-- GANCHO — contador/placar. 1080x1920, --alpha.
     Odômetro de verdade: cada casa é uma fita de dígitos que ROLA, e a casa de
     cima só anda quando a de baixo vira. Casas à esquerda nascem quando o
     número chega nelas. A diferença entra como etiqueta amarela.
     dec=2 (opcional): casas decimais — conta em centavos e mostra a vírgula (R$ 218,93).
     saldo=1 (opcional): o número é SALDO — negativo é prejuízo (vermelho, rótulo `rot`),
       positivo é lucro (verde, rótulo `rot2`); mostra o valor sem sinal e troca ao cruzar o zero.
     passos=t:v,t:v (opcional): sobe em DEGRAUS — em cada t (s da peça) o odômetro
     rola até v, sem etiqueta e sem som (quem soa é o plano: a moeda de cada carta).
       ?de=0&para=1240&rot=novos seguidores&pre=&suf=&t=0.3&dc=1.6&pos=centro&dur=4 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.zona{position:absolute;left:56px;right:70px;display:flex;justify-content:center}
.zona.topo{top:240px}
.zona.centro{top:760px}
.zona.base{top:1260px}
.pl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:28px 40px 30px;opacity:0}
.pl .rt{font:700 30px/1 var(--fm);letter-spacing:.12em;text-transform:uppercase;color:var(--ink6)}
.num{display:flex;align-items:center;font:700 var(--tn,168px)/1 var(--fd);letter-spacing:-.03em;color:var(--ink)}
.num .ps{font-size:.5em;margin-right:.12em;align-self:center}
.col{width:var(--cw,.6em);height:1.06em;overflow:hidden;position:relative;transition:none}
.col .st{display:flex;flex-direction:column}
.col .st span{height:1.06em;display:flex;align-items:center;justify-content:center}
.sep{width:var(--sw,.22em);text-align:center;overflow:hidden}
.dl{position:absolute;right:-26px;top:-34px;padding:12px 18px;font:700 40px/1 var(--fm);border-radius:var(--raio-s);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div class="zona" id="z">
    <div class="pl nb" id="pl">
      <div class="rt" id="rt"></div>
      <div class="num" id="num"></div>
      <div class="dl nb cor-mk" id="dl"></div>
    </div>
  </div>
</div>
<script>
const dur = D.n('dur', '4'), t0 = D.n('t', '0.3'), dc = D.n('dc', '1.6');
// Tudo conta em unidades da última casa (centavos com dec=2); a vírgula é só desenho.
const dec = Math.max(0, Math.round(D.n('dec', '0'))), esc = Math.pow(10, dec);
const de = Math.round(D.n('de', '0') * esc), para = Math.round(D.n('para', '1240') * esc);
document.getElementById('z').classList.add(['topo', 'centro', 'base'].includes(D.q('pos')) ? D.q('pos') : 'centro');
document.getElementById('rt').textContent = D.q('rot', 'novos seguidores');
const pre = D.q('pre', ''), suf = D.q('suf', '');
const passos = D.q('passos', '').split(',').map(x => x.split(':').map(Number))
  .filter(p => p.length === 2 && p.every(n => !isNaN(n))).map(([t, v]) => [t, Math.round(v * esc)]);
const saldo = D.q('saldo') === '1';
const casas = Math.max(dec + 1, String(Math.max(Math.abs(de), Math.abs(para), 1, ...passos.map(p => Math.abs(p[1])))).length);
const num = document.getElementById('num');
if (pre) num.insertAdjacentHTML('beforeend', `<span class="ps">${pre}</span>`);
const cols = [];
for (let p = casas - 1; p >= 0; p--) {
  const c = document.createElement('span'); c.className = 'col'; c.dataset.p = p;
  c.innerHTML = '<span class="st">' + '01234567890'.split('').map(d => `<span>${d}</span>`).join('') + '</span>';
  num.appendChild(c); cols.push(c);
  if (dec && p === dec) { const s = document.createElement('span'); s.className = 'sep'; s.dataset.p = p; s.dataset.dec = 1; s.textContent = ','; num.appendChild(s); cols.push(s); }
  else if (p > dec && (p - dec) % 3 === 0) { const s = document.createElement('span'); s.className = 'sep'; s.dataset.p = p; s.textContent = '.'; num.appendChild(s); cols.push(s); }
}
if (suf) num.insertAdjacentHTML('beforeend', `<span class="ps" style="margin:0 0 0 .12em">${suf}</span>`);
const dif = para - de;
document.getElementById('dl').textContent = (dif >= 0 ? '+' : '−') +
  (Math.abs(dif) / esc).toLocaleString('pt-BR', {minimumFractionDigits: dec, maximumFractionDigits: dec});

D.monta(tl => {
  // o número inteiro cabe na placa: a fonte sai do número de casas
  const util = document.getElementById('z').clientWidth - 80 - 20;
  // A casa tem a largura do dígito mais largo DESTA fonte: com .6em fixo (medida da Space
  // Grotesk) a Unbounded do tema tinteiro saía com os lados dos números comidos.
  const mede = t => { const x = document.createElement('span'); x.textContent = t;
    x.style.cssText = 'position:absolute;visibility:hidden;white-space:pre'; num.appendChild(x);
    const w = x.getBoundingClientRect().width / parseFloat(getComputedStyle(num).fontSize); x.remove(); return w; };
  const cw = Math.max(...'0123456789'.split('').map(mede)) + .02, sw = Math.max(mede(','), mede('.')) + .02;
  num.style.setProperty('--cw', cw + 'em'); num.style.setProperty('--sw', sw + 'em');
  const em = casas * cw + (Math.floor((casas - 1 - dec) / 3) + (dec ? 1 : 0)) * sw + (pre ? .5 * pre.length * .6 + .12 : 0) + (suf ? .5 * suf.length * .6 + .12 : 0);
  // `?k=` (escala do núcleo) vale aqui também: o tamanho sai do JS, não do CSS.
  document.documentElement.style.setProperty('--tn', Math.floor(Math.min(168, util / em) * D.n('k', '1')) + 'px');
  const rt = document.getElementById('rt');
  let sinal = null;
  const pinta = w => {
    if (saldo && (w < 0) !== sinal) {
      sinal = w < 0;
      rt.textContent = sinal ? D.q('rot', 'prejuízo') : D.q('rot2', 'lucro');
      num.style.color = sinal ? 'var(--no)' : 'var(--ok)';
    }
    const v = Math.abs(w);
    cols.forEach(c => {
      const p = +c.dataset.p, base = Math.pow(10, p);
      // com casas decimais, o zero à esquerda da vírgula e os centavos sempre aparecem (R$ 0,40)
      const vivo = p <= dec || v >= base;
      if (c.classList.contains('sep')) { c.style.width = (c.dataset.dec || vivo) ? 'var(--sw)' : '0'; return; }
      c.style.width = vivo ? 'var(--cw)' : '0';
      let pos;
      if (p === 0) pos = v % 10;
      else { const resto = v % base; pos = Math.floor(v / base) % 10 + Math.max(0, resto - (base - 1)); }
      c.firstChild.style.transform = `translateY(${-pos * 100 / 11}%)`;
    });
  };
  const o = {v: de};
  pinta(de);
  D.pousa('#pl', t0, {rot: D.P.ROT, s: 1.06, som: 'pop'});
  tl.call(() => pinta(de), null, 0);
  if (passos.length) {
    document.getElementById('dl').style.display = 'none';
    passos.forEach(([t, v]) => {
      tl.to(o, {v: Math.round(v), duration: .45, ease: 'expo.out', onUpdate: () => pinta(o.v)}, t);
      tl.to('#num', {scale: 1.05, duration: .12, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: 'left center'}, t);
    });
  } else {
    tl.fromTo(o, {v: de}, {v: para, duration: dc, ease: 'expo.out', onUpdate: () => pinta(o.v)}, t0 + .3);
    D.cue(t0 + .3, 'tick-roll', {dur: dc});
    tl.fromTo('#dl', {opacity: 0, scale: .3, rotation: -20}, {opacity: 1, scale: 1, rotation: 5, duration: .4, ease: 'back.out(3)'}, t0 + .3 + dc * .55);
    D.cue(t0 + .3 + dc * .55, 'ding');
    tl.to('#num', {scale: 1.05, duration: .14, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: 'left center'}, t0 + .3 + dc * .55);
  }
  D.flutua('#pl', t0 + .8, dur - .5, .8);
  D.sai('#pl', dur - .45);
  return dur;
});
</script>
</body>
</html>
