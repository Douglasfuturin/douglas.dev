<!DOCTYPE html>
<!-- OFERTA — barras que crescem. 1440x1028.
     Cada barra sobe no instante em que é dita, passa um pouco do tamanho (mola)
     e assenta; o número em cima conta junto. A barra de destaque é azul.
       ?hd=Vendas por mês&b=Jan|12@0.5;Fev|18@0.9;Mar|41|d@1.4&pre=R$ &suf=k&dur=4.5 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1440px;height:1028px}
#stage{padding:40px var(--marg) 36px;justify-content:flex-start}
.hd{font-size:72px;margin-bottom:10px}
.graf{position:relative;flex:1;display:flex;align-items:flex-end;gap:36px;padding:0 20px;
  border-bottom:calc(var(--bw)*1.5) solid var(--ink);margin-bottom:84px}
.cl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.cl .vl{font:700 54px/1 var(--fd);letter-spacing:-.03em;color:var(--ink);margin-bottom:14px;opacity:0;white-space:nowrap}
.cl .br{width:100%;height:0;border-bottom:0;border-radius:var(--raio) var(--raio) 0 0}
.cl .rt{position:absolute;bottom:-70px;left:0;right:0;text-align:center;font:700 36px/1 var(--fm);
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink6);opacity:0;white-space:nowrap}
.cl.d .rt{color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="hd" id="h"></div>
  <div class="graf" id="g"></div>
</div>
<script>
const dur = D.n('dur', '4.5');
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('h').innerHTML = D.q('hd', 'Vendas por <b>mês</b>');
const pre = D.q('pre', ''), suf = D.q('suf', '');
const bs = D.itens('b', 'Jan|12@0.5;Fev|18@0.8;Mar|27@1.1;Abr|41|d@1.5', ['rt', 'v', 'd']);
bs.forEach(b => b.v = parseFloat(b.v));
const max = Math.max(...bs.map(b => b.v));
const casas = bs.some(b => b.v % 1) ? 1 : 0;
const fmt = n => pre + n.toLocaleString('pt-BR', {minimumFractionDigits: casas, maximumFractionDigits: casas}) + suf;
const g = document.getElementById('g');
bs.forEach((b, i) => {
  const d = document.createElement('div');
  d.className = 'cl' + (b.d ? ' d' : ''); d.id = 'cl' + i;
  d.innerHTML = `<span class="vl" id="v${i}">${fmt(b.v)}</span><span class="br nb${b.d ? ' cor-ac' : ''}" id="b${i}"></span><span class="rt">${b.rt}</span>`;
  g.appendChild(d);
});

D.monta(tl => {
  D.cabe('.hd', 44);
  const H = g.clientHeight - 90;
  D.camera(dur, 1.0, 1.02);
  if (D.q('kick')) D.carimbo('#k', .06);
  D.titulo('#h', .15);
  bs.forEach((b, i) => {
    const h = Math.max(24, b.v / max * H);
    tl.fromTo('#b' + i, {height: 0, '--shx': '0px'}, {height: h, '--shx': D.SH + 'px', duration: D.P.ENT * 1.5, ease: D.P.MOLA}, D.at(b.t));
    tl.fromTo('#cl' + i + ' .rt', {opacity: 0, y: -10}, {opacity: 1, y: 0, duration: .3}, D.at(b.t));
    tl.fromTo('#v' + i, {opacity: 0}, {opacity: 1, duration: .2}, D.at(b.t) + .05);
    D.conta('#v' + i, 0, b.v, b.t + .05, D.P.ENT * 1.5, fmt);
    D.cue(b.t, 'pop');
  });
  D.sai(['#k', '#h', '#g'], dur - .45);
  return dur;
});
</script>
</body>
</html>
