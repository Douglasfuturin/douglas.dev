<!DOCTYPE html>
<!-- ENSAIO — linha do tempo que corre na lateral. 1920x1080, --alpha (frente).
     Faixa de papel no lado livre com a linha vertical; cada marco cai no tempo
     dele e a linha ROLA pra deixar o marco atual na altura dos olhos. Os que
     passaram ficam apagados.
       ?it=2019|GPT-2 assusta os próprios criadores@0.4;2022|...@1.4&kick=linha do tempo&lado=dir&t0=0.2&dur=5 -->
<html lang="pt-BR" class="h alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/ensaio.js"></script>
<style>
.pn{position:absolute;top:90px;bottom:90px;width:840px;background:var(--tex),var(--pp);border:var(--bw) solid var(--ink);box-shadow:var(--sh) var(--sh) 0 var(--ink);overflow:hidden}
.pn .kick{position:absolute;left:60px;top:40px;z-index:2;font-size:20px}
/* os marcos que já passaram somem num degradê antes de chegar no título */
.trk{position:absolute;left:0;right:0;top:0;height:6000px}
.vis{position:absolute;inset:0;-webkit-mask-image:linear-gradient(transparent 0,transparent 110px,#000 190px);mask-image:linear-gradient(transparent 0,transparent 110px,#000 190px)}
.ln{position:absolute;left:131px;top:-3000px;height:6000px;width:6px;background:var(--ink)}
.mc{position:absolute;left:0;right:40px;display:flex;align-items:flex-start;gap:26px;padding-left:114px;opacity:0}
.mc .dt{flex:none;width:40px;height:40px;margin-top:4px;border-radius:50%;background:#fff;border:var(--bw) solid var(--ink)}
.mc .tx{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.mc .an{padding:9px 14px 7px;font:700 22px/1 var(--fm);letter-spacing:.06em;background:var(--mk);border:3px solid var(--ink);border-radius:6px}
.mc .ev{font:700 36px/1.2 var(--fd);letter-spacing:-.02em;color:var(--ink);text-wrap:balance}
</style>
</head>
<body>
<div id="stage"><div class="pn" id="pn" data-c="frente"><div class="kick" id="k"></div><div class="vis"><div class="trk" id="trk"><div class="ln"></div></div></div></div></div>
<script>
const dur = D.n('dur', '5'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id), PASSO = 190, OLHO = 400;
const p = E.pessoa('dir'), esq = p.lado === 'esq';
Object.assign($('pn').style, esq ? {right: '-20px', borderRadius: '16px 0 0 16px'} : {left: '-20px', borderRadius: '0 16px 16px 0'});
$('k').textContent = D.q('kick', 'linha do tempo');
const its = D.itens('it', '2019|GPT-2 assusta os próprios criadores@0.4;2022|ChatGPT chega a 100 milhões de pessoas@1.4;2024|os agentes começam a trabalhar sozinhos@2.4;2026|uma pessoa monta uma equipe inteira@3.4', ['an', 'ev']);
its.forEach((o, i) => $('trk').insertAdjacentHTML('beforeend', `<div class="mc" style="top:${i * PASSO}px"><div class="dt"></div><div class="tx"><span class="an">${o.an}</span><span class="ev">${o.ev || ''}</span></div></div>`));
D.monta(tl => {
  const pn = $('pn'), mcs = [...document.querySelectorAll('.mc')], fechado = esq ? 'inset(-30px -30px -30px 100%)' : 'inset(-30px 100% -30px -30px)';
  tl.fromTo(pn, {clipPath: fechado}, {clipPath: 'inset(-30px -30px -30px -30px)', duration: .55, ease: 'power3.inOut'}, D.at(t0));
  D.carimbo('#k', t0 + .3, 0);
  gsap.set('#trk', {y: OLHO});
  its.forEach((o, i) => {
    const t = isNaN(o.t) ? t0 + .5 + i : o.t;
    if (i > 0) {
      tl.to('#trk', {y: OLHO - i * PASSO, duration: .6, ease: D.P.MOLA}, D.at(t) - .12);
      D.cue(t - .12, 'swish');
      tl.to(mcs[i - 1], {opacity: .42, duration: .3}, D.at(t));
      tl.to(mcs[i - 1].querySelector('.dt'), {backgroundColor: D.css('--ink'), duration: .2}, D.at(t));
    }
    D.pousa(mcs[i], t, {dx: 30, dy: 0, dr: 0});
    tl.fromTo(mcs[i].querySelector('.dt'), {scale: .3, backgroundColor: '#FFFFFF'}, {scale: 1, backgroundColor: D.css('--mk'), duration: .35, ease: D.P.MOLA}, D.at(t) + .05);
  });
  if (D.q('sai', '1') !== '0') { D.sai(['#k', '.mc'], dur - .6); tl.to(pn, {clipPath: fechado, duration: .4, ease: 'power3.in'}, dur - .42); }
  return dur;
});
</script>
</body>
</html>
