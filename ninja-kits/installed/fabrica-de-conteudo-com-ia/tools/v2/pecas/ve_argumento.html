<!DOCTYPE html>
<!-- ENSAIO — mapa de argumento: afirmação → porque → então. 1920x1080, --alpha (frente).
     Três blocos no lado livre, ligados por setas que se desenham de cima pra
     baixo. O "então" é o bloco azul: é a conclusão que a pessoa leva.
       ?it=Afirmação|Aprender a programar não é o gargalo.@0.3;Porque|...@1.4;Então|...@2.6&lado=dir&t0=0.2&dur=5 -->
<html lang="pt-BR" class="h alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/ensaio.js"></script>
<style>
.cl{position:absolute;top:120px;display:flex;flex-direction:column;align-items:flex-start}
.bl{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px 28px 24px;max-width:100%;opacity:0}
.bl span{font:700 20px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--ink4)}
.bl.cor-ac span{color:var(--mk)}
.bl b{font:700 40px/1.2 var(--fd);letter-spacing:-.02em;text-wrap:balance}
.sq{height:62px;padding-left:44px;transform-origin:top;opacity:0}
</style>
</head>
<body>
<div id="stage"><div class="cl" id="cl" data-c="frente"></div></div>
<script>
const dur = D.n('dur', '5'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
const p = E.pessoa('dir');
Object.assign($('cl').style, p.lado === 'esq' ? {left: (p.r + 60) + 'px', width: (1800 - p.r - 60) + 'px'} : {left: '140px', width: Math.min(820, p.l - 200) + 'px'});
const its = D.itens('it', 'Afirmação|Aprender a programar não é o gargalo.@0.3;Porque|a IA já escreve o código — falta dizer o que fazer.@1.4;Então|o que vale é saber explicar o seu processo.@2.6', ['rot', 'tx']);
const seta = '<svg width="40" height="62" viewBox="0 0 40 62"><path d="M20 2 V44" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"></path><polygon points="4,36 20,58 36,36" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"></polygon><path d="M20 2 V44" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"></path><polygon points="6,38 20,56 34,38" fill="#0B0D12"></polygon></svg>';
$('cl').innerHTML = its.map((o, i) => `<div class="bl nb${i === its.length - 1 ? ' cor-ac' : ''}"><span>${o.rot}</span><b>${o.tx || ''}</b></div>`).join(`<div class="sq">${seta}</div>`);
D.monta(tl => {
  const bls = [...document.querySelectorAll('.bl')], sqs = [...document.querySelectorAll('.sq')];
  its.forEach((o, i) => {
    const t = isNaN(o.t) ? t0 + i * 1.1 : o.t;
    if (i > 0) tl.fromTo(sqs[i - 1], {scaleY: 0, opacity: 0}, {scaleY: 1, opacity: 1, duration: .3, ease: 'power2.out'}, D.at(t) - .3);
    D.pousa(bls[i], t, {dy: -26, som: i === its.length - 1 ? 'pop' : null});
  });
  D.sai(['.bl', '.sq'], dur - .45);
  return dur;
});
</script>
</body>
</html>
