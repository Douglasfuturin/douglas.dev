<!DOCTYPE html>
<!-- PROVA — a linha do tempo do próprio vídeo. 1080x1920, --alpha.
     Um painel de papel no alto da zona segura com as faixas do vídeo que está tocando. A agulha
     amarela anda no relógio dele (`linha` s do começo ao fim) e cada faixa acende quando aquilo
     entra no vídeo: o bloco cai na hora e no lugar dele. Em cima, a linha do que entra agora, no
     tamanho do celular. A etiqueta MONTANDO vira PRONTO. As faixas não são só as de um editor: são
     as da geração (roteiro, voz, rosto, cenário), e a revelação pisca cada uma com a origem dela.
       faixas  "ROTEIRO;VOZ;…" (de cima pra baixo) · linha  quantos segundos a linha mostra (dur)
       b       "FAIXA|t0|t1|rot|cor@entra;…": o bloco de t0 a t1 (no relógio do vídeo) cai em `entra`;
               cor ac (azul, padrão) · mk (amarelo) · ink · mudo (cinza, o que já estava no bruto)
       acende  "FAIXA@t;…": quando o nome da faixa acende (sem: no primeiro bloco dela; no bruto, 0)
       grifa   "FAIXA": os blocos dela ficam amarelos enquanto a agulha passa (o roteiro sendo dito)
       onda    "FAIXA": a faixa da voz, desenhada com `picos` (a forma da voz real); `corte` é quando
               os `buracos` dela fecham (as pausas cortadas) e ela fica azul. Sem corte: já cortada
       pisca   "FAIXA|texto@t;…": a faixa pisca em amarelo, a etiqueta com o texto bate e o cursor vai até ela
       agora   "texto@t;…": a linha do que entra agora; *palavra* vai grifada
       tag  (MONTANDO) · tag2  (PRONTO) · t_tag  (-1: não vira)
       Parâmetro ausente cai no exemplo: o plano passa todos, vazios quando não usa · topo  o y do painel (300) · dur
     ?faixas=ROTEIRO;VOZ;ROSTO;LEGENDA;CENÁRIO;TRILHA;CAPA&linha=8&dur=8&grifa=ROTEIRO&onda=VOZ&corte=0.8&t_tag=6.1 (b, agora e pisca do exemplo: os padrões da peça) -->
<html lang="pt-BR" class="alfa" data-qa="entra-seco fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block;position:relative;overflow:hidden}
.pn{position:absolute;left:65px;right:65px;padding:30px 22px 16px}
.aba{position:absolute;top:-24px;height:48px;display:flex;align-items:center;gap:12px;padding:0 18px;
  font:700 28px/1 var(--fm);letter-spacing:.06em;white-space:nowrap;border-radius:var(--raio-s)}
.aba.rel{left:22px}
.aba.st{right:22px}
.aba .pt{width:16px;height:16px;border-radius:50%;background:var(--no);border:3px solid var(--ink)}
.st2{opacity:0}
.ag-ln{position:relative;height:60px;margin-bottom:12px;overflow:hidden}
.ag-ln .fr{position:absolute;left:0;right:0;top:0;font:700 50px/60px var(--fd);letter-spacing:var(--ls);
  color:var(--ink);white-space:nowrap;opacity:0}
.fr b{font-weight:inherit;padding:0 .1em;margin:0 -.04em;background:linear-gradient(var(--mk),var(--mk)) no-repeat 0 60%/100% 88%}
.fx{display:grid;grid-template-columns:150px 1fr;row-gap:4px;align-items:center}
.nm{font:700 15px/14px var(--fm);letter-spacing:.08em;color:var(--ink4);height:14px;padding-left:2px}
.ln{position:relative;height:14px;border-radius:4px;background:var(--pp2)}
.bl{position:absolute;top:0;bottom:0;border:2px solid var(--ink);border-radius:4px;background:var(--ac);
  transform-origin:0 50%;overflow:hidden;font:700 11px/12px var(--fm);color:#fff;padding-left:4px;white-space:nowrap}
.bl.mk{background:var(--mk);color:var(--ink)}
.bl.ink{background:var(--ink)}
.bl.mudo{background:var(--ink2);border-color:var(--ink4);color:var(--ink6)}
.ov{position:absolute;inset:0;overflow:hidden;border-radius:4px}
.br{position:absolute;top:50%;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink4)}
.pc{position:absolute;left:8px;top:-12px;padding:6px 12px;font:700 26px/1 var(--fm);letter-spacing:.06em;
  text-transform:uppercase;border-radius:var(--raio-s);opacity:0;z-index:3;white-space:nowrap}
.rw{position:relative}
.agu{position:absolute;top:-6px;bottom:-6px;left:0;width:4px;margin-left:-2px;background:var(--mk);
  box-shadow:0 0 0 2px var(--ink);z-index:2}
.agu i{position:absolute;top:-12px;left:-8px;width:20px;height:14px;background:var(--mk);border:2px solid var(--ink);
  border-radius:3px}
.lanes{position:absolute;left:150px;right:0;top:0;bottom:0;pointer-events:none}
.cur{position:absolute;left:0;top:0;width:52px;height:52px;opacity:0;z-index:4}
</style>
</head>
<body>
<div id="stage">
  <div class="pn nb" id="pn">
    <div class="aba rel nb" id="rel">0:00 / 0:00</div>
    <div class="aba st nb cor-mk" id="st1"><span class="pt"></span><span id="tx1"></span></div>
    <div class="aba st nb cor-ok st2" id="st2"><span>✓</span><span id="tx2"></span></div>
    <div class="ag-ln" id="ag"></div>
    <div class="rw" id="rw"><div class="fx" id="fx"></div><div class="lanes" id="lanes"><span class="agu" id="agu"><i></i></span></div></div>
  </div>
  <svg class="cur" id="cur" viewBox="0 0 52 52"><path d="M6 4 L6 40 L16 31 L23 47 L30 44 L23 28 L37 28 Z" fill="#0B0D12" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
</div>
<script>
const dur = D.n('dur', '8'), linha = D.n('linha', String(dur)), tTag = D.n('t_tag', '6.1');
const $ = id => document.getElementById(id);
const FX = D.q('faixas', 'ROTEIRO;VOZ;ROSTO;LEGENDA;CENÁRIO;TRILHA;CAPA').split(';').filter(Boolean);
const lista = (k, d) => D.q(k, d).split(';').filter(Boolean).map(s => { const i = s.lastIndexOf('@'); return [s.slice(0, i), parseFloat(s.slice(i + 1))]; });
const BL = lista('b', 'ROTEIRO|0|2.6||mudo@0;ROTEIRO|2.8|5.4||mudo@0;ROTEIRO|5.6|8||mudo@0;ROSTO|0|8|avatar|mudo@0;LEGENDA|0.2|2.5||ac@1.4;LEGENDA|2.8|5.2||ac@1.55;LEGENDA|5.6|7.8||ac@1.7;CENÁRIO|2.4|4.8|gerado|ac@2.4;CENÁRIO|4.8|8|gerado|ac@3.6;TRILHA|3.2|8||ink@3.2;CAPA|5.8|6.4|capa|mk@5.8').map(([s, e]) => { const [f, a, z, rot, cor] = s.split('|'); return {f, a: +a, z: +z, rot: rot || '', cor: cor || 'ac', e}; });
const AC = Object.fromEntries(lista('acende', '').map(([f, t]) => [f, t]));
const PI = lista('pisca', 'ROSTO|avatar@6.6;VOZ|clonada@7.1').map(([s, t]) => { const [f, tx] = s.split('|'); return {f, tx, t}; });
const AG = lista('agora', 'bruto · *nada* editado@0;VOZ · *pausas* cortadas@0.8;LEGENDA · a palavra *forte* grifada@1.4;CENÁRIO · *gerado*@2.4;TRILHA · *música*@3.2;CAPA · *feita*@5.8;ROSTO · *avatar*@6.6;VOZ · *clonada*@7.1');
const grifa = D.q('grifa', 'ROTEIRO'), onda = D.q('onda', 'VOZ'), corte = D.n('corte', '0.8'), buracos = Math.round(D.n('buracos', '4'));
$('pn').style.top = D.n('topo', '300') + 'px';
$('tx1').textContent = D.q('tag', 'MONTANDO');
$('tx2').textContent = D.q('tag2', 'PRONTO');
const pct = t => Math.max(0, Math.min(100, t / linha * 100));
FX.forEach((f, i) => {
  $('fx').insertAdjacentHTML('beforeend', `<div class="nm" id="n${i}">${f}</div><div class="ln" id="l${i}"><span class="pc nb cor-mk" id="pc${i}"></span></div>`);
});
BL.forEach((b, k) => {
  const i = FX.indexOf(b.f);
  if (i < 0) return;
  $('l' + i).insertAdjacentHTML('beforeend', `<span class="bl ${b.cor === 'ac' ? '' : b.cor}" id="bl${k}" style="left:${pct(b.a)}%;width:${pct(b.z) - pct(b.a)}%">${b.rot}</span>`);
});
// a voz: a forma real (picos) na hora dela; no bruto, com buracos que empurram o resto pra direita
const iv = FX.indexOf(onda);
let barras = [];
if (iv >= 0) {
  let pk = D.q('picos', '').split(',').map(Number).filter(n => !isNaN(n) && D.q('picos'));
  if (!pk.length) pk = Array.from({length: 90}, (_, i) => .2 + .8 * Math.abs(Math.sin(i * .61) * Math.cos(i * .173)));
  const N = pk.length, fim = D.n('onda_ate', String(linha));
  // a onda do bruto passa do fim da faixa (os buracos empurram): ela é cortada ali, e a etiqueta da faixa não
  $('l' + iv).insertAdjacentHTML('afterbegin', '<span class="ov" id="ov"></span>');
  barras = pk.map((v, i) => {
    const x = pct(fim * (i + .5) / N);
    // o bruto: cada buraco é uma pausa de 4% da linha, espalhada pela fala
    const vaos = Math.floor((i / N) * (buracos + 1));
    $('ov').insertAdjacentHTML('beforeend', `<span class="br" id="v${i}" style="height:${Math.round(Math.max(.15, Math.min(1, v)) * 100)}%"></span>`);
    return {el: $('v' + i), x, x0: corte >= 0 ? x + vaos * 4 : x};
  });
}
const relogio = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
AG.forEach(([tx], k) => $('ag').insertAdjacentHTML('beforeend', `<div class="fr" id="a${k}">${tx.replace(/\*([^*]+)\*/g, '<b>$1</b>')}</div>`));

D.monta(tl => {
  D.cabe('.ag-ln .fr', 34, ['.ag-ln', 1]);
  const lanes = $('lanes'), W = lanes.clientWidth;
  // o painel e o que já estava no bruto estão no quadro 0: o gancho é a linha do tempo vazia
  gsap.set('#pn', {'--shx': D.SH + 'px'});
  const total = relogio(linha);
  const o = {t: 0};
  const anda = () => { $('agu').style.left = (pct(o.t) / 100 * W) + 'px'; $('rel').textContent = `${relogio(o.t)} / ${total}`; };
  anda();
  tl.fromTo(o, {t: 0}, {t: Math.min(dur, linha), duration: Math.min(dur, linha), ease: 'none', onUpdate: anda}, 0);
  // os nomes: aceso é tinta; o que ainda não entrou fica cinza
  FX.forEach((f, i) => {
    const t = f in AC ? AC[f] : Math.min(...BL.filter(b => b.f === f).map(b => b.e), f === onda ? 0 : Infinity);
    if (!isFinite(t)) return;
    if (t <= 0) { gsap.set('#n' + i, {color: D.css('--ink')}); return; }
    tl.fromTo('#n' + i, {color: D.css('--ink4')}, {color: D.css('--ink'), duration: .2}, t);
    tl.fromTo('#n' + i, {scale: 1}, {scale: 1.25, duration: .12, yoyo: true, repeat: 1, ease: 'power2.out', transformOrigin: 'left center'}, t);
  });
  // o bloco cai na hora: abre da esquerda e quica
  const novos = new Set();
  BL.forEach((b, k) => {
    const el = $('bl' + k);
    if (!el) return;
    if (b.e <= 0) return;
    tl.fromTo(el, {scaleX: 0, opacity: 0}, {scaleX: 1, opacity: 1, duration: .32, ease: D.P.MOLA}, D.at(b.e) + .1);
    if (!novos.has(b.e)) { novos.add(b.e); D.cue(b.e, 'pop'); }
  });
  // o roteiro dito: o bloco da frase fica amarelo enquanto a agulha passa
  BL.forEach((b, k) => {
    if (b.f !== grifa || !$('bl' + k)) return;
    tl.to('#bl' + k, {backgroundColor: D.css('--mk'), borderColor: D.css('--ink'), duration: .1}, Math.max(0, b.a));
    if (b.z < dur) tl.to('#bl' + k, {backgroundColor: D.css('--ink2'), borderColor: D.css('--ink4'), duration: .2}, b.z);
  });
  // as pausas cortadas: os buracos fecham e a voz fica azul
  if (barras.length) {
    barras.forEach(b => gsap.set(b.el, {left: b.x0 + '%', yPercent: -50}));
    if (corte >= 0) {
      barras.forEach((b, i) => tl.to(b.el, {left: b.x + '%', backgroundColor: D.css('--ac'), duration: .45, ease: 'power3.inOut'}, corte + i * .002));
      D.cue(corte, 'swish');
    } else barras.forEach(b => gsap.set(b.el, {backgroundColor: D.css('--ac')}));
  }
  // a linha do que entra agora: a anterior sobe e a nova entra por baixo
  AG.forEach(([, t], k) => {
    const prox = AG[k + 1];
    if (t <= 0) gsap.set('#a' + k, {opacity: 1});
    else tl.fromTo('#a' + k, {opacity: 0, yPercent: 100}, {opacity: 1, yPercent: 0, duration: .3, ease: D.P.EASE}, D.at(t) + .05);
    if (prox && prox[1] < dur) tl.to('#a' + k, {opacity: 0, yPercent: -100, duration: .2, ease: D.P.SAI}, D.at(prox[1]));
  });
  // a revelação: a faixa pisca, a etiqueta da origem bate e o cursor vai até ela
  PI.forEach((p, k) => {
    const i = FX.indexOf(p.f);
    if (i < 0) return;
    const pc = $('pc' + i);
    if (pc.textContent && pc.textContent !== p.tx) pc.textContent += ' · ' + p.tx;
    else pc.textContent = p.tx;
    tl.fromTo('#l' + i, {backgroundColor: D.css('--pp2')}, {backgroundColor: D.css('--mk'), duration: .12, yoyo: true, repeat: 3}, D.at(p.t));
    D.carimbo('#pc' + i, p.t, -2);
    // uma etiqueta por vez: ela sai quando a próxima bate (as faixas são vizinhas e elas se empilhavam)
    const sai = Math.min(PI[k + 1] ? PI[k + 1].t - .05 : p.t + 1.4, dur - .05);
    tl.to('#pc' + i, {opacity: 0, scale: .85, duration: .15, ease: D.P.SAI}, D.at(sai));
    const r = $('l' + i).getBoundingClientRect(), x = r.left + r.width * .35, y = r.top + r.height / 2 - 4;
    if (k === 0) tl.fromTo('#cur', {opacity: 0, left: x + 120, top: y + 160}, {opacity: 1, left: x, top: y, duration: .4, ease: D.P.EASE}, D.at(p.t) - .25);
    else tl.to('#cur', {left: x, top: y, duration: .35, ease: D.P.MOLA}, D.at(p.t) - .2);
    D.cue(p.t - .05, 'click');
  });
  if (PI.length) tl.to('#cur', {opacity: 0, duration: .2}, Math.min(dur - .2, PI[PI.length - 1].t + 1.2));
  // a etiqueta vira: MONTANDO sai e PRONTO bate no lugar
  if (tTag >= 0 && tTag < dur) {
    tl.to('#st1', {opacity: 0, scale: .8, duration: .18, ease: D.P.SAI}, D.at(tTag));
    D.carimbo('#st2', tTag, -2);
  }
  return dur;
});
</script>
</body>
</html>
