<!DOCTYPE html>
<!-- PROVA — moldura de captura. 1080x1920 (?alfa=1 pra por cima do vídeo).
     A captura real entra numa janela neobrutal, a câmera APROXIMA a região
     que prova (foco=x,y,l,a em frações da imagem) e ela é marcada: contorno
     que se desenha, sublinhado ou grifo. A etiqueta diz o que se vê.
       ?img=captura.png&rot=painel de anúncios&foco=0.08,0.30,0.55,0.14&marca=contorno
        &tag=Plano pronto&t=0.2&t_zoom=1.0&t_marca=1.9&dur=5 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
#stage{padding:0 60px;justify-content:center;align-items:stretch}
.mold{position:relative}
.jan{display:flex;flex-direction:column;overflow:hidden;opacity:0}
.bar{flex:none;display:flex;align-items:center;gap:14px;height:66px;padding:0 22px;background:var(--mk);border-bottom:var(--bw) solid var(--ink)}
.bar i{width:20px;height:20px;border:3px solid var(--ink);border-radius:5px;background:#fff}
.bar span{font:700 26px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp{position:relative;overflow:hidden;background:#fff}
.cam{position:absolute;left:0;top:0;width:100%;height:100%}
.cam svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ct{fill:none;stroke:var(--mk)}
.co{fill:none;stroke:var(--ink)}
.gr{fill:var(--mk);mix-blend-mode:multiply;opacity:.75}
.tag{position:absolute;right:28px;bottom:-44px;padding:16px 24px;font:700 40px/1 var(--fd);letter-spacing:var(--ls);white-space:nowrap;opacity:0}
.tag:empty{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="kick" id="k"></div>
  <div class="mold" id="mo">
    <div class="jan nb" id="j">
      <div class="bar"><i></i><span id="rt"></span></div>
      <div class="vp" id="vp"><div class="cam" id="cam"></div></div>
    </div>
    <div class="tag nb cor-ink" id="tg"></div>
  </div>
</div>
<script>
const dur = D.n('dur', '5'), t0 = D.n('t', '0.2');
const tz = D.n('t_zoom', '1.0'), tm = D.n('t_marca', tz + .9 + '');
document.getElementById('k').textContent = D.q('kick', '');
document.getElementById('rt').textContent = D.q('rot', 'captura');
document.getElementById('tg').textContent = D.q('tag', 'Plano pronto');
const img = D.midia('#cam', D.q('img'), 'captura da tela', 'cover');
const foco = D.q('foco', '0.08,0.30,0.55,0.14').split(',').map(Number);
const marca = D.q('marca', 'contorno');

D.monta(tl => {
  const vp = document.getElementById('vp'), cam = document.getElementById('cam');
  const W = vp.clientWidth || 952;
  const prop = img && img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1.1;
  const H = Math.min(1360, Math.round(W * prop));
  vp.style.height = H + 'px';
  if (img && W * prop > 1360) img.style.objectFit = 'cover', img.style.objectPosition = 'top';
  const [fx, fy, fw, fh] = foco;
  // zoom que enquadra a região com folga, sem mostrar borda vazia
  const zz = Math.max(1, Math.min(3, Math.min(1 / (fw * 1.25), 1 / (fh * 1.25))));
  const cx = (fx + fw / 2) * W, cy = (fy + fh / 2) * H;
  const tx = Math.min(0, Math.max(W - W * zz, W / 2 - cx * zz)), ty = Math.min(0, Math.max(H - H * zz, H / 2 - cy * zz));
  // a marca vive dentro da câmera (aproxima junto); o traço é dividido pelo zoom
  const sw = 14 / zz, so = 22 / zz, pad = 10 / zz;
  const rx = fx * W - pad, ry = fy * H - pad, rw = fw * W + pad * 2, rh = fh * H + pad * 2;
  let s = `<svg viewBox="0 0 ${W} ${H}">`;
  if (marca === 'grifo') s += `<rect class="gr" id="mk" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="${6 / zz}"></rect>`;
  else if (marca === 'sublinhado') {
    const y = ry + rh + 6 / zz;
    s += `<path class="co" id="mo2" stroke-width="${so}" stroke-linecap="round" d="M ${rx} ${y} L ${rx + rw} ${y}"></path>`
       + `<path class="ct" id="mk" stroke-width="${sw}" stroke-linecap="round" d="M ${rx} ${y} L ${rx + rw} ${y}"></path>`;
  } else {
    s += `<rect class="co" id="mo2" stroke-width="${so}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="${10 / zz}"></rect>`
       + `<rect class="ct" id="mk" stroke-width="${sw}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="${10 / zz}"></rect>`;
  }
  cam.insertAdjacentHTML('beforeend', s + '</svg>');

  D.camera(dur, 1.0, 1.02);
  if (D.q('kick')) D.carimbo('#k', .06);
  D.pousa('#j', t0, {rot: D.P.ROT * .5, dy: -30, som: 'obturador'});
  gsap.set(cam, {transformOrigin: '0 0'});
  tl.fromTo(cam, {x: 0, y: 0, scale: 1}, {x: tx, y: ty, scale: zz, duration: 1.0, ease: 'power3.inOut'}, D.at(tz));
  D.cue(tz, 'zoom-in');
  if (marca === 'grifo') {
    tl.fromTo('#mk', {attr: {width: 0}}, {attr: {width: rw}, duration: .5, ease: 'power3.inOut'}, D.at(tm));
  } else {
    ['#mo2', '#mk'].forEach(sel => {
      const el = document.querySelector(sel), L = el.getTotalLength();
      gsap.set(el, {strokeDasharray: L, strokeDashoffset: L});
      tl.to(el, {strokeDashoffset: 0, duration: .55, ease: 'power2.inOut'}, D.at(tm));
    });
  }
  D.cue(tm, 'swish');
  if (D.q('tag', 'Plano pronto')) D.carimbo('#tg', tm + .45, D.P.ROT - 2);
  D.sai(['#k', '#mo'], dur - .45);
  return dur;
});
</script>
</body>
</html>
