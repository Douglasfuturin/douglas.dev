<!DOCTYPE html>
<!-- TRANSIÇÃO — corte em blocos. 1080x1920 ou 1920x1080 (?ar=), --alpha.
     Faixas de cor chapada, com borda tinta e sombra dura na frente, atravessam o
     quadro em cascata sem parar: cada uma entra por um lado e sai pelo outro num
     movimento só. O quadro fica coberto só no instante do `meio`, onde cai o
     corte do vídeo por baixo (window.__corte). No círculo, cada disco cresce e
     já sai andando no mesmo instante, sem segurar.
     forma=faixas|diagonal|circulo · cores=ac,mk,ink (ac mk ink br) · dir=direita|esquerda|cima|baixo
       ?forma=faixas&cores=ac,mk,ink&dir=direita&meio=0.5&dur=1 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html,body{background:transparent}
#stage{position:relative;overflow:hidden;background:none;padding:0;display:block}
#pl{position:absolute;inset:0}
html.diag #pl{inset:0 -35%;transform:skewX(-14deg)}
html.diag.vert #pl{inset:-35% 0;transform:skewY(-14deg)}
.fx{position:absolute;inset:0;box-sizing:border-box}
.fx.ac{background:var(--ac)}.fx.mk{background:var(--mk)}.fx.ink{background:var(--ink)}.fx.br{background:#fff}
.fx.c{inset:auto;border-radius:50%}
</style>
</head>
<body>
<div id="stage"><div id="pl"></div></div>
<script>
const R = document.documentElement, HZ = D.q('ar', '1080x1920').startsWith('1920');
if (HZ) R.classList.add('h');
const W = HZ ? 1920 : 1080, H = HZ ? 1080 : 1920;
const forma = ['faixas', 'diagonal', 'circulo'].includes(D.q('forma')) ? D.q('forma') : 'faixas';
const cores = D.q('cores', 'ac,mk,ink').split(',').map(c => c.trim()).filter(c => ['ac', 'mk', 'ink', 'br'].includes(c)).slice(0, 4);
if (!cores.length) cores.push('ac', 'mk', 'ink');
const dir = ['direita', 'esquerda', 'cima', 'baixo'].includes(D.q('dir')) ? D.q('dir') : 'direita';
const vert = dir === 'cima' || dir === 'baixo', sg = dir === 'esquerda' || dir === 'cima' ? -1 : 1;
const n = cores.length, E = .34, S = .07;   // meia travessia de cada faixa, cascata
const meio = Math.max(E + (n - 1) * S, D.n('meio', '0.5'));
const dur = Math.max(meio + E + .02, D.n('dur', '1'));
window.__corte = meio;
if (forma === 'diagonal') R.classList.add('diag');
if (vert) R.classList.add('vert');
const pl = document.getElementById('pl'), SH = D.SH * 1.6, BW = 8, eixo = vert ? 'yPercent' : 'xPercent';
const els = cores.map(c => {
  const d = document.createElement('div'); d.className = 'fx ' + c;
  // borda tinta nos dois lados que cruzam o quadro; sombra dura no lado que vai na frente
  if (vert) { d.style.borderTop = d.style.borderBottom = BW + 'px solid var(--ink)'; d.style.boxShadow = `0 ${sg * SH}px 0 var(--ink)`; }
  else { d.style.borderLeft = d.style.borderRight = BW + 'px solid var(--ink)'; d.style.boxShadow = `${sg * SH}px 0 0 var(--ink)`; }
  pl.appendChild(d); return d;
});
if (forma === 'circulo') {
  const D0 = Math.hypot(W, H) + 60;
  els.forEach(d => { d.classList.add('c'); Object.assign(d.style, {width: D0 + 'px', height: D0 + 'px', left: (W - D0) / 2 + 'px', top: (H - D0) / 2 + 'px', border: BW + 'px solid var(--ink)', boxShadow: `0 0 0 ${SH}px var(--ink)`}); });
}
D.monta(tl => {
  // a última faixa (a de cima) passa pelo centro exatamente no `meio`: é o único
  // instante em que o quadro fica todo coberto
  const tA = meio - (n - 1) * S - E;
  els.forEach((d, i) => {
    const a = tA + i * S;
    if (forma === 'circulo') {
      // cresce e já sai andando: cada disco cobre o quadro só no instante em que chega
      tl.fromTo(d, {scale: 0}, {scale: 1, duration: E, ease: 'power3.in'}, a);
      tl.to(d, {[eixo]: sg * 112, duration: E, ease: 'power1.out'}, a + E);
    } else tl.fromTo(d, {[eixo]: -sg * 112}, {[eixo]: sg * 112, duration: E * 2, ease: 'power2.inOut'}, a);
  });
  D.cue(Math.max(0, tA + .12), 'whoosh');
  D.cue(meio + .08, 'whoosh-out');
  return dur;
});
</script>
</body>
</html>
