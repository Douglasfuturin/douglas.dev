<!DOCTYPE html>
<!-- GANCHO — o vídeo pronto se abre em camadas. 1080x1920, opaca (cobre o vídeo na janela dela).
     O quadro inteiro gira e se separa numa pilha de planos, cada um com o que uma parte da fábrica
     fez (o roteiro, a voz, o avatar, a cena, a legenda, as peças, a trilha, a capa), com o nome
     dela na borda. Dois modos:
       abre     o quadro 0 já está se abrindo (`abre0`); aberta, a pilha perde as camadas de cima pra
                baixo (`t_sai`) até sobrar a primeira, que volta a ser a tela inteira (`fim`): o
                vídeo segue dali. A camada "~onda" sai com o cue tape-stop: quem compõe para a trilha ali
       remonta  o quadro parado (`topo`) se abre, as camadas de `focos` saem da pilha cada uma no
                seu tempo, e em `t_fecha` tudo se junta de novo no quadro `fim`
       l        "rótulo|quem fez|imagem;…" de baixo pra cima. Imagem vazia: o marcador listrado.
                "~onda": as barras dos `picos` (a trilha)
       topo     o quadro composto, de onde a pilha sai · fim  o quadro em que ela termina
       picos    "0.2,0.8,…" a forma da onda · focos  "2,3@1.2;5@2.4" (remonta) · t_aberto · t_fecha · dur
       esc · ax  a escala e o deslocamento da pilha aberta (.6 e -260): com 8 camadas, a etiqueta das de trás
                passa da borda direita
       ay · sobe  a altura da pilha aberta (60) e quanto a camada do foco sobe (330). No anúncio, a pilha
                menor e mais alta deixa as etiquetas e o que está escrito nas camadas na zona segura
     abre: ?l=roteiro|o agente|;voz clonada|voz|;avatar|avatar|;cena gerada|cenas|;legenda|skill legendas|;trilha|skill estilo|~onda;capa|skill estilo|&modo=abre&abre0=0.35&t_aberto=0.7&t_sai=1.3&dur=2.4&tema=tinta
     remonta: ?l=roteiro|o agente|;voz clonada|voz|;avatar|avatar|;legenda|skill legendas|&modo=remonta&focos=0@0.8;1,2@1.6;3@2.4&t_fecha=3.2&dur=3.8&tema=tinta -->
<html lang="pt-BR" data-qa="entra-seco fica">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px}
#stage{width:1080px;height:1920px;padding:0;display:block;position:relative;overflow:hidden;perspective:2600px}
#pilha{position:absolute;inset:0;transform-style:preserve-3d}
.cm{position:absolute;inset:0;border-radius:6px;outline:4px solid var(--ink2);background:var(--ink8);overflow:visible}
.cm.vidro{background:rgba(220,228,255,.10)}
.cm .mid,.cm .vazio{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
.cm img.mid{object-fit:cover}
.cm .vazio span{font-size:60px}
.cm .ond{position:absolute;left:60px;right:60px;top:760px;height:400px;display:flex;align-items:center;gap:8px}
.cm .ond i{flex:1;background:var(--mk);border:3px solid var(--ink);border-radius:4px}
.et{position:absolute;right:-90px;top:-44px;display:flex;align-items:baseline;gap:18px;padding:18px 28px;opacity:0;white-space:nowrap}
.et .nm{font:800 76px/1 var(--fd);letter-spacing:var(--ls);text-transform:uppercase}
.et .qm{font:600 44px/1 var(--fm);letter-spacing:.04em;color:var(--ink6)}
.plano{position:absolute;inset:0;opacity:0}
.plano .mid,.plano .vazio{position:absolute;inset:0;width:100%;height:100%}
.plano img.mid{object-fit:cover}
</style>
</head>
<body>
<div id="stage"><div id="pilha"></div><div class="plano" id="fim"></div></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const modo = D.q('modo', 'abre'), dur = D.n('dur', modo === 'abre' ? '2.4' : '3.8');
const L = D.q('l', 'roteiro|o agente|;voz clonada|voz|;avatar|avatar|;cena gerada|cenas|;legenda|skill legendas|;trilha|skill estilo|~onda;capa|skill estilo|')
  .split(';').filter(Boolean).map(s => { const [rot, quem, img] = s.split('|'); return {rot, quem, img: img || ''}; });
const n = L.length, meio = (n - 1) / 2, GAP = Math.min(185, 1300 / Math.max(1, n - 1));
const picos = D.q('picos', '0.3,0.6,0.9,0.5,0.8,1,0.7,0.4,0.6,0.9,0.5,0.3,0.7,1,0.8,0.5,0.4,0.7,0.9,0.6').split(',').map(parseFloat);
const tAb = D.n('t_aberto', modo === 'abre' ? '0.7' : '0.55');
const FOCOS = D.q('focos', modo === 'abre' ? '' : '0@0.8;1,2@1.6;3@2.4').split(';').filter(Boolean)
  .map(s => { const [is, t] = s.split('@'); return {is: is.split(',').map(Number), t: parseFloat(t)}; });

L.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'cm' + (c.img && c.img !== '~onda' && !/\.(jpe?g)$/i.test(c.img) ? ' vidro' : '');
  d.id = 'c' + i;
  if (c.img === '~onda') {
    d.classList.add('vidro');
    d.innerHTML = `<div class="ond">${picos.map(p => `<i style="height:${Math.round(14 + 86 * p)}%"></i>`).join('')}</div>`;
  } else D.midia(d, c.img, c.rot);
  d.insertAdjacentHTML('beforeend', `<div class="et nb cor-mk" id="e${i}"><span class="nm">${esc(c.rot)}</span><span class="qm">${esc(c.quem)}</span></div>`);
  $('pilha').appendChild(d);
});
// o quadro composto na frente da pilha: é o vídeo pronto, antes de se abrir
const topo = document.createElement('div');
topo.className = 'cm'; topo.id = 'topo';
D.midia(topo, D.q('topo', ''), 'o vídeo pronto');
$('pilha').appendChild(topo);
D.midia($('fim'), D.q('fim', modo === 'abre' ? L[0].img : D.q('topo', '')), modo === 'abre' ? L[0].rot : 'o vídeo pronto');

D.monta(tl => {
  const z = i => (i - (n - 1)) * GAP;   // a de cima no plano da tela; as outras vão pra trás
  const aberto = {rotationY: -34, rotationX: 8, scale: D.n('esc', '.6'), x: D.n('ax', '-260'), y: D.n('ay', '60')};
  const fechado = {rotationY: 0, rotationX: 0, scale: 1, x: 0, y: 0};
  const lerp = u => Object.fromEntries(Object.keys(aberto).map(k => [k, fechado[k] + (aberto[k] - fechado[k]) * u]));
  const u0 = modo === 'abre' ? D.n('abre0', '0.35') : 0;
  gsap.set('#pilha', lerp(u0));
  L.forEach((_, i) => gsap.set('#c' + i, {z: z(i) * u0}));
  gsap.set('#topo', {z: GAP * .3 * u0, opacity: 1});

  // abre: a pilha gira e se separa; o composto da frente vai sumindo e as etiquetas chegam em cascata
  tl.to('#pilha', {...aberto, duration: tAb, ease: 'power3.out'}, 0);
  L.forEach((_, i) => tl.to('#c' + i, {z: z(i), duration: tAb, ease: 'power3.out'}, 0));
  tl.to('#topo', {z: GAP * .9, opacity: 0, duration: tAb * .8, ease: 'power2.in'}, 0);
  D.cue(.02, 'whoosh');
  L.forEach((_, i) => {
    const t = .12 + (tAb * .9) * i / Math.max(1, n - 1);
    tl.fromTo('#e' + i, {opacity: 0, x: -30}, {opacity: 1, x: 0, duration: .18, ease: D.P.EASE}, t);
  });
  D.cue(.2, 'tick-roll', {dur: +(tAb * .9).toFixed(3)});

  if (modo === 'abre') {
    // as de cima saem primeiro, uma a uma, e a de baixo volta a ser a tela inteira
    const tS = D.n('t_sai', '1.3'), passo = Math.min(.1, (dur - tS - .55) / Math.max(1, n - 1));
    for (let i = n - 1; i >= 1; i--) {
      const t = tS + (n - 1 - i) * passo;
      tl.to('#c' + i, {y: -1700, rotationX: -30, opacity: 0, duration: .32, ease: D.P.SAI}, t);
      if (L[i].img === '~onda') D.cue(t, 'tape-stop');   // a trilha que tocava sob a pilha para junto
    }
    D.cue(tS, 'whoosh-out');
    const tP = tS + (n - 1) * passo;
    tl.to('#e0', {opacity: 0, duration: .12}, tP);
    tl.to('#pilha', {...fechado, duration: Math.max(.25, dur - tP - .12), ease: 'power3.inOut'}, tP);
    tl.to('#c0', {z: 0, duration: Math.max(.25, dur - tP - .12), ease: 'power3.inOut'}, tP);
    tl.to('#fim', {opacity: 1, duration: .1, ease: 'none'}, dur - .1);
    D.cue(dur - .1, 'thud');
  } else {
    // as camadas do foco saem pro lado, a etiqueta acende; a anterior volta pro lugar
    FOCOS.forEach((f, k) => {
      const ant = FOCOS[k - 1];
      if (ant) ant.is.forEach(i => tl.to('#c' + i, {y: 0, duration: .25, ease: 'power2.inOut'}, D.at(f.t)));
      f.is.forEach(i => tl.to('#c' + i, {y: -D.n('sobe', '330'), duration: .32, ease: D.P.MOLA}, D.at(f.t)));
      D.cue(f.t, 'swish');
    });
    const tF = D.n('t_fecha', '3.2');
    const ult = FOCOS[FOCOS.length - 1];
    if (ult) ult.is.forEach(i => tl.to('#c' + i, {y: 0, duration: .2, ease: 'power2.in'}, tF));
    tl.to('.et', {opacity: 0, duration: .15}, tF);
    tl.to('#pilha', {...fechado, duration: Math.max(.25, dur - tF - .15), ease: 'power3.inOut'}, tF);
    L.forEach((_, i) => tl.to('#c' + i, {z: 0, duration: Math.max(.25, dur - tF - .15), ease: 'power3.inOut'}, tF));
    tl.to('#fim', {opacity: 1, duration: .12, ease: 'none'}, dur - .14);
    D.cue(dur - .14, 'thud');
  }
  return dur;
});
</script>
</body>
</html>
