<!DOCTYPE html>
<!-- ENSAIO — comparativo A × B em duas colunas, com a pessoa no MEIO. 1920x1080, --alpha, EM CAMADAS.
     Um × gigante bate atrás dela; as colunas se preenchem dos dois lados, um
     item de cada vez, alternando. Pessoa centralizada.
       ?a=Contratar&b=Montar agentes&ia=R$ 4.500 por mês;3 meses pra treinar;...&ib=R$ 200 por mês;...&t0=0.2&dur=6 -->
<html lang="pt-BR" class="h alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<script src="../nucleo/ensaio.js"></script>
<style>
.x{position:absolute;left:0;right:0;top:170px;text-align:center;font:700 620px/.8 var(--fd);color:var(--mk);-webkit-text-stroke:6px var(--ink);text-shadow:16px 16px 0 var(--ink);opacity:0}
.cl{position:absolute;top:150px;width:470px;display:flex;flex-direction:column;gap:14px}
.cl .tt{padding:18px 24px;font:700 44px/1.05 var(--fd);letter-spacing:-.02em;opacity:0}
.cl .it{display:flex;align-items:flex-start;gap:14px;padding:14px 20px;font:700 28px/1.25 var(--fd);letter-spacing:-.01em;color:var(--ink);opacity:0}
.cl .it i{flex:none;font-style:normal;font:700 28px/1.25 var(--fm)}
#ca .it i{color:var(--no)}
#cb .it i{color:var(--ok)}
</style>
</head>
<body>
<div id="stage"><div class="x" id="x" data-c="tras">×</div><div class="cl" id="ca" data-c="frente" style="left:100px"></div><div class="cl" id="cb" data-c="frente" style="left:1350px"></div></div>
<script>
const dur = D.n('dur', '6'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
E.pessoa('centro');
const ia = D.q('ia', 'R$ 4.500 por mês;3 meses pra treinar;sai e leva o processo').split(';').filter(Boolean);
const ib = D.q('ib', 'R$ 200 por mês;pronto em uma semana;o processo fica com você').split(';').filter(Boolean);
$('ca').innerHTML = `<div class="tt nb cor-ink">${D.q('a', 'Contratar')}</div>` + ia.map(s => `<div class="it nb"><i>✕</i><span>${s}</span></div>`).join('');
$('cb').innerHTML = `<div class="tt nb cor-ac">${D.q('b', 'Montar agentes')}</div>` + ib.map(s => `<div class="it nb"><i>✓</i><span>${s}</span></div>`).join('');
D.monta(tl => {
  tl.fromTo('#x', {opacity: 0, scale: 1.3, rotation: -8}, {opacity: 1, scale: 1, rotation: 0, duration: .5, ease: D.P.HEROI}, D.at(t0));
  D.cue(t0, 'impact');
  D.pousa('#ca .tt', t0 + .15, {dy: -30});
  D.pousa('#cb .tt', t0 + .3, {dy: -30});
  const A = [...document.querySelectorAll('#ca .it')], B = [...document.querySelectorAll('#cb .it')];
  for (let k = 0; k < Math.max(A.length, B.length); k++) {
    const t = t0 + .9 + k * .75;
    if (A[k]) D.pousa(A[k], t, {dx: -30, dy: 0});
    if (B[k]) D.pousa(B[k], t + .28, {dx: 30, dy: 0});
  }
  D.sai(['#x', '.cl > *'], dur - .45);
  return dur;
});
</script>
</body>
</html>
