<!DOCTYPE html>
<!-- GANCHO — abertura / título do vídeo. 1920x1080, papel (ou ?alfa=1 sobre o vídeo).
     O título sobe por palavra e o marcador grifa a <b>. O bloco do episódio cai
     com o soco do herói, e o que a aula entrega pousa em fila.
       ?kick=aula 03 · n8n do zero&hd=Seu primeiro <b>agente</b> em 20 minutos
        &it=webhook;agente;planilha&num=03&numrot=aula&t0=0.2&dur=4.5
     num=- tira o bloco do episódio. -->
<html lang="pt-BR" class="h">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<link rel="stylesheet" href="../nucleo/direcao-h.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
.ab{position:absolute;inset:0;display:flex;align-items:center;gap:90px;padding:0 140px}
.esq{flex:1;min-width:0}
#hd{font-size:116px;margin-bottom:44px}
.chips{display:flex;gap:16px;flex-wrap:wrap}
.chip{padding:14px 22px 12px;font:700 26px/1 var(--fm);letter-spacing:.06em;text-transform:uppercase;border-radius:var(--raio-s);opacity:0}
.num{flex:none;width:460px;height:560px;display:flex;flex-direction:column;justify-content:space-between;padding:34px 40px 30px;opacity:0}
.num > span{font:700 30px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase}
.num b{display:block;font:700 300px/.8 var(--fd);letter-spacing:-.07em;color:var(--mk)}
</style>
</head>
<body>
<div id="stage">
  <div class="ab">
    <div class="esq"><div class="kick" id="k"></div><div class="hd" id="hd"></div><div class="chips" id="ch"></div></div>
    <div class="num nb cor-ac" id="nu"><span id="nr"></span><b id="nb"></b></div>
  </div>
</div>
<script>
const dur = D.n('dur', '4.5'), t0 = D.n('t0', '0.2'), $ = id => document.getElementById(id);
$('k').textContent = D.q('kick', 'aula 03 · n8n do zero');
$('hd').innerHTML = D.q('hd', 'Seu primeiro <b>agente</b> em 20 minutos');
D.q('it', 'webhook;agente;planilha').split(';').filter(Boolean).forEach(s => $('ch').insertAdjacentHTML('beforeend', `<span class="chip nb">${s}</span>`));
const num = D.q('num', '03');
if (num === '-') $('nu').remove(); else { $('nb').textContent = num; $('nr').textContent = D.q('numrot', 'aula'); }

D.monta(tl => {
  if ($('nu')) D.cabe('#nb', 120, '.num');
  D.camera(dur, 1, 1.025);
  D.carimbo('#k', t0, 0);
  const fim = D.titulo('#hd', t0 + .15, .07);
  if ($('nu')) D.pousa('#nu', t0 + .3, {rot: -2, dy: -90, dr: -7, s: 1.1, ease: D.P.HEROI, som: 'impact'});
  D.lista('.chip', fim + .05, .12, {dy: -22});
  D.flutua('#nu', t0 + 1.3, dur - .5, .8);
  D.sai(['#k', '#hd', '.chip', '#nu'], dur - .45);
  return dur;
});
</script>
</body>
</html>
