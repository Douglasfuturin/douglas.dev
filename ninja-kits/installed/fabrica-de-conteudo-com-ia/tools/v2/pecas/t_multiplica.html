<!DOCTYPE html>
<!-- TIPO — o mesmo número em outra escala, v2. 1080x1920.
     O número continua de onde a fala deixou (visível desde o quadro 0). O fator
     aterrissa ao lado; na batida, ele dá um soco, a unidade ROLA de "por mês"
     pra "por ano" dentro da etiqueta, e o número dispara com expo.out.
       ?de=4500&fator=12&un_de=POR MÊS&un_para=POR ANO&rot=× 12 MESES&t_fator=0.2&t_soma=1.3&dur=4.2 -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
#stage{padding:0 70px;justify-content:center;align-items:flex-start}
.un{padding:.4em .66em .34em;margin-bottom:30px;border-radius:var(--raio-s)}
.jan{height:1.2em;overflow:hidden;font:700 42px/1.2 var(--fm);letter-spacing:.14em;text-transform:uppercase}
.vl{font:900 var(--t-big)/.92 var(--fd);font-stretch:var(--fx);color:var(--ac);letter-spacing:-.05em;
  white-space:nowrap;text-shadow:.03em .03em 0 var(--ink);transform-origin:left center}
.fator{display:inline-flex;align-items:center;margin-top:52px;padding:22px 32px;opacity:0}
.fator b{font:700 50px/1 var(--fm);color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div class="un nb cor-mk" id="u"><div class="jan"><div id="ro"><div id="u1"></div><div id="u2"></div></div></div></div>
  <div class="vl" id="v"></div>
  <div class="fator nb cor-ink" id="f"><b id="fb"></b></div>
</div>
<script>
const dur = D.n('dur', '4.2');
const de = D.n('de', '4500'), fator = D.n('fator', '12'), para = de * fator;
const tFator = D.n('t_fator', '0.2'), tSoma = D.n('t_soma', '1.3');
document.getElementById('u1').textContent = D.q('un_de', 'POR MÊS');
document.getElementById('u2').textContent = D.q('un_para', 'POR ANO');
document.getElementById('fb').textContent = D.q('rot', '× ' + fator);
document.getElementById('v').textContent = D.brl(para);

D.monta(tl => {
  D.cabe('.vl', 120);
  D.camera(dur, 1.0, 1.035);
  gsap.set('#u', {rotation: D.P.ROT});
  D.pousa('#f', tFator, {rot: -D.P.ROT, dx: -30});
  // na batida: soco do fator, a unidade rola, o número dispara
  tl.to('#f', {scale: 1.12, duration: .12, ease: 'power2.out', yoyo: true, repeat: 1}, D.at(tSoma) - .08);
  tl.to('#ro', {yPercent: -50, duration: .42, ease: D.P.MOLA}, D.at(tSoma));
  D.conta('#v', de, para, tSoma, .9);
  D.sai(['#u', '#v', '#f'], dur - .45);
  return dur;
});
</script>
</body>
</html>
