<!DOCTYPE html>
<!-- PROVA — lower-third: quem está falando. 1080x1920, --alpha.
     A placa do nome ABRE da esquerda (recorte), as letras sobem, e o cargo bate
     como etiqueta azul. Sai fechando pelo mesmo lado.
       ?nome=Seu nome&cargo=fundador · 4 agentes rodando&handle=@usuario&y=1380&lado=esquerda&t=0.2&dur=4 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body{width:1080px;height:1920px;background:transparent}
#stage{width:1080px;height:1920px;background:none;padding:0;display:block}
.lw{position:absolute;left:56px;right:70px;top:var(--y,1380px);display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.lw.dir{align-items:flex-end}
.nome{padding:18px 30px 22px;font:700 76px/1 var(--fd);letter-spacing:var(--ls);white-space:nowrap}
.lin2{display:flex;align-items:center;gap:14px}
.cargo{padding:14px 22px;font:700 32px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;border-radius:var(--raio-s);white-space:nowrap;opacity:0}
.hd2{padding:14px 20px;font:700 32px/1 var(--fm);border-radius:var(--raio-s);white-space:nowrap;opacity:0}
.cargo:empty,.hd2:empty{display:none}
</style>
</head>
<body>
<div id="stage">
  <div class="lw" id="lw">
    <div class="nome nb" id="nm"></div>
    <div class="lin2"><span class="cargo nb cor-ac" id="cg"></span><span class="hd2 nb cor-mk" id="hd"></span></div>
  </div>
</div>
<script>
const dur = D.n('dur', '4'), t0 = D.n('t', '0.2');
if (D.q('y')) document.documentElement.style.setProperty('--y', D.q('y') + 'px');
const dir = D.q('lado') === 'direita';
if (dir) document.getElementById('lw').classList.add('dir');
// padrão neutro: a peça vai no pacote do aluno. O nome de verdade vem no plano (nome=)
document.getElementById('nm').textContent = D.q('nome', 'Seu nome');
document.getElementById('cg').textContent = D.q('cargo', 'fundador');
document.getElementById('hd').textContent = D.q('handle', '');

D.monta(tl => {
  D.cabe('.nome', 44, '.lw');
  const nm = document.getElementById('nm'), W = nm.offsetWidth + 60;
  // o recorte deixa a sombra dura aparecer: folga negativa nas bordas
  const fechado = dir ? `inset(-30px -40px -40px ${W}px)` : `inset(-30px ${W}px -40px -30px)`;
  const aberto = 'inset(-30px -40px -40px -30px)';
  tl.fromTo(nm, {clipPath: fechado}, {clipPath: aberto, duration: .5, ease: 'power3.inOut'}, D.at(t0));
  D.cue(t0, 'swish');
  D.palavras('#nm', t0 + .18, .05);
  if (D.q('cargo', 'fundador')) D.carimbo('#cg', t0 + .45, D.P.ROT);
  if (D.q('handle')) D.carimbo('#hd', t0 + .6, -D.P.ROT);
  if (D.q('sai', '1') !== '0') {
    tl.to(['#cg', '#hd'], {opacity: 0, y: 16, duration: .2, ease: 'power2.in'}, dur - .5);
    tl.to(nm, {clipPath: fechado, duration: .35, ease: 'power3.in'}, dur - .4);
    D.cue(dur - .4, 'whoosh-out');
  }
  return dur;
});
</script>
</body>
</html>
