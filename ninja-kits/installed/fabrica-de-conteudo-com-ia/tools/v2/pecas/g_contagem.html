<!DOCTYPE html>
<!-- GANCHO — a contagem que bate e a frase do "pare". 1080x1920 ou 1920x1080 (?ar=), --alpha.
     Os números caem gigantes, um por batida, cada um num bloco de outra cor com a
     onda de choque; o anterior despenca. No fim a frase bate em blocos, a *palavra
     no amarelo, e o quadro dá um tranco curto.
       ?n=3&passo=0.4&l=PARE DE|*ROLAR&t0=0.1&dur=3.2 -->
<html lang="pt-BR" class="alfa">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../nucleo/direcao-v2.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../nucleo/direcao-v2.js"></script>
<style>
html,body,#stage{width:1080px;height:1920px}
html.h,html.h body,html.h #stage{width:1920px;height:1080px}
html,body{background:transparent}
#stage{position:relative;overflow:hidden;background:none;padding:0;display:block}
.nu{position:absolute;left:50%;top:50%;width:600px;height:600px;margin:-300px 0 0 -300px;display:flex;align-items:center;justify-content:center;
  font:700 470px/1 var(--fd);letter-spacing:-.06em;border-radius:var(--raio);opacity:0;box-sizing:border-box;padding-bottom:30px}
html.h .nu{width:540px;height:540px;margin:-270px 0 0 -270px;font-size:420px}
.nu.c0{background:var(--ac);color:#fff}.nu.c1{background:var(--mk);color:var(--ink)}.nu.c2{background:#fff;color:var(--ink)}
.on{position:absolute;left:50%;top:50%;width:660px;height:660px;margin:-330px 0 0 -330px;border-radius:50%;border:16px solid var(--mk);box-shadow:0 0 0 6px var(--ink),inset 0 0 0 6px var(--ink);opacity:0}
.fr{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.fl{padding:16px 40px 24px;font:700 150px/.95 var(--fd);letter-spacing:-.05em;border-radius:var(--raio);white-space:nowrap;opacity:0;background:#fff;color:var(--ink)}
html.h .fl{font-size:136px}
.fl.a{background:var(--mk)}
</style>
</head>
<body>
<div id="stage"><div class="fr" id="fr"></div></div>
<script>
const R = document.documentElement, HZ = D.q('ar', '1080x1920').startsWith('1920');
if (HZ) R.classList.add('h');
const t0 = D.n('t0', '0.1'), passo = D.n('passo', '0.4'), N = Math.max(1, Math.min(9, Math.round(D.n('n', '3'))));
const ls = D.q('l', 'PARE DE|*ROLAR').split('|').map(s => s.trim()).filter(Boolean);
const tf = t0 + N * passo, dur = Math.max(tf + 1.3, D.n('dur', '3.2'));
const st = document.getElementById('stage'), fr = document.getElementById('fr');
const nus = [...Array(N)].map((_, i) => {
  const on = document.createElement('div'); on.className = 'on'; st.insertBefore(on, fr);
  const d = document.createElement('div'); d.className = 'nu nb c' + (i % 3); d.textContent = N - i; st.insertBefore(d, fr);
  return {d, on};
});
ls.forEach(l => { const e = document.createElement('div'), a = l.startsWith('*'); e.className = 'fl nb' + (a ? ' a' : ''); e.textContent = a ? l.slice(1) : l; fr.appendChild(e); });
D.monta(tl => {
  nus.forEach(({d, on}, i) => {
    const ti = t0 + i * passo, lado = i % 2 ? 1 : -1;
    tl.fromTo(d, {opacity: 0, scale: 1.8, rotation: lado * 12}, {opacity: 1, scale: 1, rotation: lado * 2.5, duration: .26, ease: 'power4.out'}, D.at(ti));
    tl.fromTo(on, {opacity: 1, scale: .55}, {opacity: 0, scale: 1.7, duration: .5, ease: 'power2.out'}, ti);
    tl.to(d, {y: 320, rotation: lado * 18, opacity: 0, duration: .22, ease: 'power3.in'}, ti + passo - .06);
    D.cue(ti, 'hit');
  });
  document.querySelectorAll('.fl').forEach((e, j) => tl.fromTo(e, {opacity: 0, scale: 1.55, y: -40, rotation: 0},
    {opacity: 1, scale: 1, y: 0, rotation: j % 2 ? 1.6 : -1.6, duration: .32, ease: D.P.HEROI}, D.at(tf) + j * .12));
  const tt = tf + (ls.length - 1) * .12;
  D.cue(tt, 'impact');
  tl.to('#stage', {keyframes: {x: [20, -15, 10, -5, 0]}, duration: .3, ease: 'none'}, tt);
  D.flutua('.fl', tt + .5, dur - .5, 1.1);
  D.sai('.fl', dur - .45);
  return dur;
});
</script>
</body>
</html>
